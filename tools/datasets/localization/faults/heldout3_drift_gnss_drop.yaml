# 3 つ目の調整に使わない故障の組 (heldout3_*): heldout2_* を見てから 地図照合の規則 (AMCL を入力のまま採る条件) を直したので、
# その後に直した規則を確かめるために作った組。時刻・大きさ・向きを heldout_*・heldout2_* とも既存の故障とも変えている。
# 時刻は再生開始からの経過秒。
# GNSS の欠けの間の AMCL のずれ。
faults:
  - {type: gnss_drop, start: 65.0, end: 140.0}
  - {type: amcl_drift, start: 75.0, end: 125.0, rate: {x: -0.03, y: -0.04, yaw: 0.0}, interval: 1.0}
