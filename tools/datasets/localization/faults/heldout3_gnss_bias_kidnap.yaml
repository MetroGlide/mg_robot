# 3 つ目の調整に使わない故障の組 (heldout3_*): heldout2_* を見てから 地図との照合の規則 (AMCL を入力のまま採る条件) を直したので、
# その後に直した規則を確かめるために作った組。時刻・大きさ・向きを heldout_*・heldout2_* とも既存の故障とも変えている。
# 時刻は再生開始からの経過秒。
# GNSS の偏りの間の AMCL の飛び。
faults:
  - {type: gnss_bias, start: 90.0, end: 160.0, bias: {x: 1.5, y: 2.0}}
  - {type: kidnap, at: 115.0, offset: {x: -3.0, y: -1.5, yaw: 0.15}}
