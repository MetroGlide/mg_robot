# 2 つ目の調整に使わない故障の組 (heldout2_*): heldout_* を原因の調べに使ったので、その後に直した規則を確かめる
# ために、直す前に作った組。時刻・大きさ・向きを heldout_* とも既存の故障とも変えている。時刻は再生開始からの経過秒。
# GNSS の偏りの間の AMCL のずれ。
faults:
  - {type: gnss_bias, start: 60.0, end: 130.0, bias: {x: -2.0, y: 1.5}}
  - {type: amcl_drift, start: 80.0, end: 110.0, rate: {x: 0.0, y: 0.08, yaw: 0.0}, interval: 1.0}
