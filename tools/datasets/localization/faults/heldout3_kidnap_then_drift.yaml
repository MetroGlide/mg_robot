# 3 つ目の調整に使わない故障の組 (heldout3_*): heldout2_* を見てから 地図照合の規則 (AMCL を入力のまま採る条件) を直したので、
# その後に直した規則を確かめるために作った組。時刻・大きさ・向きを heldout_*・heldout2_* とも既存の故障とも変えている。
# 時刻は再生開始からの経過秒。
# AMCL の飛びの後に、向きを含むずれ。
faults:
  - {type: kidnap, at: 60.0, offset: {x: 0.0, y: 2.5, yaw: 0.1}}
  - {type: amcl_drift, start: 100.0, end: 150.0, rate: {x: 0.05, y: 0.0, yaw: -0.003}, interval: 1.0}
