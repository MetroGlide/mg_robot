# 角での AMCL の取り違えの評価 (今の自己位置推定用の地図と、評価する走行の先頭から角を抜けるまで)。
# 地図は map_for20261017 の Region1 (この区間は全体がこの領域に入る)。区間の終わり近くの角
# (350-355 s ごろ、向きが約 70° から 10° へ変わる) で、AMCL の粒子が割れて誤った方に収束することがある
# (起きる割合は AMCL の動きのノイズの設定による)。取り違えた試行の割合で比べる (--runs を増やす)。
# 地図は切り貼りで作ったため、地図を作った走行の SLAM 出力は無い。地図の gnss_transform.yaml は
# 評価する走行の SLAM 出力とアンカーが同じで回転も 0 (どちらも地図の座標 = UTM - アンカー) なので、
# 真値の座標をそのまま使えるよう、slam_dir には評価する走行の SLAM 出力を書く。
# ただし地図は切り貼りなので、場所によって真値と地図の座標が局所的にずれる (角の手前で約 1.5 m)。
# 取り違えは位置ではなく主に向きで判定する (eval_localization.py の --mispick-position をそのずれより大きく)。
name: map20261017r1_eval051635_corner
description: 角での取り違えの評価 (地図 map_for20261017 の Region1、評価 051635 の 0-400 s)
map:
  localization_yaml: /root/ros2_data/map_for20261017/Region1_jikoichi.yaml
  gnss_transform: /root/ros2_data/map_for20261017/gnss_transform.yaml
  slam_dir: /root/ros2_data/rosbag/TC2026/20260913/record_slam_20260913_051635/20260921_2243
eval:
  bag: /root/ros2_data/rosbag/TC2026/20260913/record_slam_20260913_051635
  slam_dir: /root/ros2_data/rosbag/TC2026/20260913/record_slam_20260913_051635/20260921_2243
  start_offset: 0.0
  duration: 400.0
