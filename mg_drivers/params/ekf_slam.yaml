ekf_slam_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false
    publish_acceleration: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    # world_frame=odom: ローカルEKF。odom→base_footprint TFを担当し、slam_toolboxがmap→odomを担当する
    world_frame: odom

    # 車輪オドメトリ: 速度のみ使用 (vx, vyaw)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    odom0_differential: false
    odom0_relative: false

    # GPS由来オドメトリ (navsat_transform_nodeが出力): 位置のみ使用 (x, y)
    # differential=trueで絶対位置を速度に変換し、odomフレーム内でのジャンプを防ぐ
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 5
    odom1_differential: true
    odom1_relative: false
    odom1_pose_rejection_threshold: 5.0

