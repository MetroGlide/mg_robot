wheel_odom_corrector_node:
  ros__parameters:
    # false にすると補正せずに生の値を通す (共分散は設定する)
    enabled: true
    # 補正は、record_slam_20260913_043837 と record_slam_20260913_051635 の走行ログから
    # tools/scripts/calib_wheel_odom.py で推定した値 (2 つの走行で k_v 1.010 / 1.013、k_w 1.033 / 1.032、
    # 遅れ 0.05 s と一致し、前半・後半でも安定)。路面や荷重が違うときは再推定する
    # 並進のスケール (車輪半径)
    k_v: 1.011
    # 旋回のスケール (実効トレッド幅)
    k_w: 1.032
    # 走行距離あたりに曲がる量 [rad/m] (左右の車輪半径差。2 つの走行で 0.0061 / 0.0047)
    yaw_bias_per_meter: 0.0054
    # 生のオドメトリの遅れ [s]。スタンプをこの分だけ過去へずらす
    time_offset: 0.05
    # 速度の出どころ。raw: ドライバの速度をスケール補正して使う / pose_diff: 補正した姿勢の差分から求める
    # ドライバの速度が 0 のまま姿勢だけ更新される期間があった (record_slam_20260913_051635 の 370-730 s)
    # ので、姿勢の差分から求める
    twist_source: pose_diff
    # pose_diff のとき、何メッセージ前の姿勢との差から求めるか (20 Hz なら 2 で 0.1 秒)
    twist_window: 2
    # 姿勢が飛んだとみなす 1 メッセージあたりの移動量 [m]。飛んだら生の姿勢に合わせ直す
    reset_jump_m: 2.0
    # 姿勢の共分散 (EKF は姿勢を使わない)
    covariance_x: 10.0
    covariance_y: 10.0
    covariance_yaw: 0.4
    # 速度の共分散 (EKF が使う)。calib_wheel_odom.py の推奨値 (補正後の窓ごとの速度誤差の σ の 3 倍)。
    # 従来は vx 0.5 / vyaw 0.78 (σ 0.7 m/s、0.9 rad/s) で、EKF がホイールの速度をほとんど使っていなかった
    covariance_vx: 0.0225
    covariance_vy: 0.0
    covariance_vyaw: 0.0036
