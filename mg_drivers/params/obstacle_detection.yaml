# obstacle_detection_3d_node のパラメータ
#
# 調整は本ファイルを編集してノードを再起動して行う。
# 起動時に採用値が INFO ログに出力され、不正値は理由付きのエラーで終了する。
# 処理速度は stats_period ごとの "stats" ログ（平均/最大 [ms]）で確認できる。
#
# パイプライン (target_frame の座標系):
#   点群を target_frame へ変換 -> ROI 内の点を 5cm 程度のグリッドに集計
#   -> セル内の z の幅 (ΔZ) が閾値を超えたセルを障害物とする
#   -> 障害物セルを連結成分にまとめ、小さい成分をノイズとして除去
#   -> 残った成分に属する点を ~/points_obstacle に出力（大きさの上限はない）
obstacle_detection_3d_node:
  ros__parameters:
    # 処理と出力の座標系。ROI の値はこの座標系で表し、地面が z=0 にある前提。
    # 地面の高さにある base_footprint を使う (base_link は地面より上にあり、ROI の高さがずれる)
    target_frame: base_footprint

    # ---- 速度に効くパラメータ ----
    # 入力点の間引き間隔。2 で処理点数がほぼ半分になる。遠方の小物体の検出感度が下がる
    stride: 1

    # ROI [m]。target_frame の原点基準。狭めるほど速くなる。
    # x・y は、コストマップの STVL の消去の錐台 (nav2_params.yaml の sensor_frame・FOV・max_z) を
    # 含むように取る。錐台が ROI からはみ出すと、検出していない場所の障害物を消してしまう。
    # z_min は地面の点を外す高さ（地面ノイズの余裕）。検出できる最小の高さは z_min + delta_z_threshold。
    # z_max は、STVL の錐台の上端 (手前の面) 以下にする。錐台より上でマークした点は消去されず、
    # 時間切れまで残る (立ち去った人の上半身などが跡として残り、走行の再開が遅れる)。
    # これより高い物は、地面から立ち上がる部分で検出する。地面から浮いた物 (この高さと上 LiDAR の面の間だけに
    # ある物) は、どちらにも見えない
    cropbox_x_min: 0.0
    cropbox_x_max: 3.0
    cropbox_y_min: -1.5
    cropbox_y_max: 1.5
    cropbox_z_min: 0.05
    cropbox_z_max: 0.35

    # グリッドの一辺 [m]。大きいほど速く、位置分解能は粗くなる
    grid_size: 0.05

    # ---- 検出感度に効くパラメータ ----
    # ROI 内でのセル内の z の最大-最小がこの値を超えると障害物。
    # 地面から z_min + この値より低い物体は検出できない (低床障害物 200mm 程度を余裕を持って拾う値)。
    # 地面のノイズで誤検出する場合は大きく、低い物体を拾いたい場合は小さくする
    delta_z_threshold: 0.10

    # ΔZ 判定に必要なセル内の最小点数。大きいほど疎なセルのノイズに強い（遠方は点が減る）
    min_points_per_cell: 2

    # セルごとに z の上下から無視する外れ値点数 (0 または 1)。
    # 1 にすると 1 点だけの飛び画素（フライングピクセル）による誤検出を抑える。
    # 有効時は 1 セルあたり 4 点以上が必要になる
    z_outlier_trim: 0

    # 障害物セル同士をつなぐ距離 [m]（grid_size 単位に丸められる）。
    # 大きいと近接する物体が 1 つのクラスタに併合され、小さいと 1 つの物体が分割され得る
    cluster_tolerance: 0.15

    # クラスタとして残す最小のセル数。1 セルだけの孤立ノイズを除去する。
    # 大きいほど小さな障害物が消える
    min_cluster_cells: 2

    # ---- 出力・診断 ----
    # クラスタの bbox / ラベルの Marker (~/cluster_markers) を出力するか。false で負荷が少し下がる
    publish_markers: true

    # 処理時間・点数の統計ログを出力するか
    publish_stats: true

    # 統計ログの出力間隔 [s]（この間の平均/最大を出力）
    stats_period: 1.0
