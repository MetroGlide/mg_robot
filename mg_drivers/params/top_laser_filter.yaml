# 上 LiDAR (/scan_top_lidar) の前処理。出力は /scan_filtered/scan_top_lidar。
# ナビゲーションのコストマップと collision_monitor の入力に使う (AMCL・SLAM は生のスキャンを使う)。
# キーは laser_filters.launch.py のノード名 (top_laser_filter) に合わせる。
top_laser_filter:
  ros__parameters:
    # 近距離のノイズを落とす。範囲外の点は NaN にする
    filter1:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.25
        upper_threshold: 30.0

    # 自車の点 (支柱・ケーブルなど) を落とす。base_footprint 基準で、nav2_params.yaml の footprint
    # (x -0.2〜0.4, y は最大 ±0.3) に 5 cm の余白を足した箱。箱は footprint と、collision_monitor の
    # PolygonApproach の points に揃える (mg_navigation の test_nav2_params_consistency.py が検査する)
    filter2:
      name: self_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: -0.25
        max_x: 0.45
        min_y: -0.35
        max_y: 0.35
        min_z: -0.5
        max_z: 2.0
        invert: false
