# このロボットの、自己位置の監督の構成 (localization_supervisor の設定ファイル)。
# 情報源 (AMCL・GNSS・EKF・ホイールオドメトリ・地図とスキャン・計画用地図)、判定のインスタンス、総合、状態遷移、
# アンカー、安全の信号、出力。書き方は localization_supervisor/doc/parameters.md。
# オフライン評価 (tools/scripts/eval_localization_offline.py) もこのファイルを読む。
version: 1

# 判定と総合の周期 [s]
period_sec: 1.0

sources:
  amcl:
    kind: pose
    input: {type: pose_with_covariance, topic: /amcl_pose_origin}
  gnss:
    kind: pose
    input: {type: odometry, topic: /odom/gps}
  # AMCL の粒子を峰に分けた仮説の集合 (分けるのは min_interval_sec ごと)。角で誤った向きに収束した後も、
  # 正しい向きの粒子が少数残ることが多い。格子は、峰を分ける大きさ (1 つの峰の広がりより大きく)
  amcl_particles:
    kind: hypotheses
    input: {type: particle_cloud, topic: /particle_cloud, min_interval_sec: 1.0, cell_m: 0.5, cell_yaw_rad: 0.26}
  # EKF は AMCL・GNSS・オドメトリを融合した結果。疑わしい情報源の特定には使わず、出力が汚れているかの判定に使う
  ekf:
    kind: pose
    derived_from: [amcl, gnss, odom]
    input: {type: odometry, topic: /ekf_global_odom}
  odom:
    kind: motion
    input: {type: odometry, topic: /odom}
  map_scan:
    kind: reference
    input: {type: map_scan, map_topic: /map, scan_topic: /scan_top_lidar, base_frame: base_footprint}
  # 計画用地図 (グローバルコストマップの静的な層と同じ地図)。安全の信号にだけ使う
  planning_map:
    kind: reference
    input: {type: occupancy_grid, topic: /planning_map}

timeline:
  motion_priority: [odom]
  horizon_sec: 30.0

# 累積 (cusum) は、score が allowance を超えた分をためる。正常なときの score がしきい値 (1.0) より十分小さい判定は、
# allowance を 1.0 より下げて、しきい値の手前からためる (少しずつずれる場合に早く気づく)。
# allowance は、オフライン評価の正常なときの score の分布 (判定ごとの最大値) より上にする
detectors:
  # AMCL と GNSS の位置の差のマハラノビス距離の二乗 (2 自由度)。標準偏差が b_max_std_m を超える GNSS は使わない。
  # 単独測位 (σ 約 1 m) でも、AMCL が数 m ずれれば食い違いとして検知できる。
  # max_score を低くして、GNSS の 1 回の外れ値 (この 2 つの判定が同時に反応する) だけでは確認に進まないようにする
  # (確認には、食い違いが 2 周期以上続く必要がある)
  amcl_gnss:
    type: pose_consistency
    sources: {a: amcl, b: gnss}
    params: {threshold: 6.0, b_max_std_m: 2.0, extra_std_m: 0.3}
    allowance: 0.6
    max_score: 2.0
  # EKF と GNSS。EKF が引きずられた (汚れた) かを見る
  ekf_gnss:
    type: pose_consistency
    sources: {a: ekf, b: gnss}
    params: {threshold: 6.0, b_max_std_m: 2.0, extra_std_m: 0.3}
    allowance: 0.6
    max_score: 2.0
  # AMCL と EKF の位置の差 [m]。復旧の収束の確認にも使う
  amcl_ekf:
    type: pose_consistency
    sources: {a: amcl, b: ekf}
    params: {metric: distance, threshold: 1.0}
    allowance: 0.6
  # 連続する AMCL の推定が示す map->odom の飛び
  amcl_jump:
    type: pose_jump
    sources: {pose: amcl, motion: odom}
    params: {threshold_m: 0.6, threshold_rad: 0.35}
    max_score: 10.0
  # EKF の姿勢でのスキャンと地図の一致。一致率の絶対値は地図の質や LiDAR の特性で決まる (正しい姿勢でも
  # 0.3 前後のことがある) ので、正常なときの中央値を基準にする。利得 (ずらしたほうが合う) は、別走行の地図との
  # 位置合わせのずれにより、正しい姿勢でも 0.4 前後になるため、使わない (gain_threshold 1.0)
  scan_ekf:
    type: scan_map
    sources: {pose: ekf, reference: map_scan}
    params: {tolerance_m: 0.3, ratio_min: 0.1, ratio_factor: 0.5, gain_threshold: 1.0}
    decay: 0.9
  # AMCL の姿勢でのスキャンと地図の一致。AMCL は同じスキャンと地図で推定しているので独立ではない
  # (誤った場所に収束していても一致率は良く見えやすい) ため、重みを下げる
  scan_amcl:
    type: scan_map
    sources: {pose: amcl, reference: map_scan}
    params: {tolerance_m: 0.3, ratio_min: 0.1, ratio_factor: 0.5, gain_threshold: 1.0}
    weight: 0.5
    decay: 0.9
  # AMCL の自己申告の共分散 (x・y の分散の和)。watchdog と同じ判定
  amcl_covariance:
    type: covariance
    sources: {pose: amcl}
    params: {metric: trace_xy, threshold: 2.0}
    weight: 0.5
  # 直近の走行のスキャンを動きで局所地図にまとめ、地図に照合する (5 秒ごと)。1 枚のスキャンより広い範囲を見るので、
  # GNSS が使えず、AMCL が誤った場所に収束して EKF も引きずられたときに効く。正しい姿勢での一致率 (この地図で
  # 0.55 以上) より低い ratio_min と、正しい姿勢での利得 (0.4 弱まで) より高い gain_threshold にする
  submap_ekf:
    type: submap_map
    sources: {pose: ekf, motion: odom, reference: map_scan}
    params: {ratio_min: 0.35, baseline_min_samples: 5, gain_threshold: 0.5}
    allowance: 0.8
  # AMCL と GNSS が食い違ったとき、どちらが悪いかの切り分けに使う。これが正常と判定できているあいだは、
  # AMCL は正しいと見なして、食い違いの疑いを GNSS だけにかける (地図と GNSS の位置合わせのずれなど)。
  # scan_amcl は AMCL と独立でないので vouch しない。判定できない周期が続くと、AMCL を疑う側に戻る
  submap_amcl:
    type: submap_map
    sources: {pose: amcl, motion: odom, reference: map_scan}
    params: {ratio_min: 0.35, baseline_min_samples: 5, gain_threshold: 0.5}
    allowance: 0.8
    vouch: [amcl]
  # AMCL の粒子が、離れた姿勢の仮説に割れているか。割れても AMCL が正しい方を選ぶことが多いので、重み 0 で
  # 記録だけする (正しい姿勢と、ずれたときの値の分布を確かめてから重みを決める)
  amcl_split:
    type: hypothesis_split
    sources: {pose: amcl, hypotheses: amcl_particles}
    params: {threshold: 0.2, separation_m: 1.0, separation_rad: 0.5}
    weight: 0.0

fusion:
  type: cusum
  params: {suspect_level: 1.0, confirm_level: 4.0, blame_margin: 1.0}

# アンカーを残す条件: 状態が NORMAL で、判定がどれも異常でなく、ここに並べた判定が正常
trust:
  require_normal: [scan_ekf]

state_machine:
  # false: 検知と通知だけ (異常を確認したら DEGRADED、消えたら NORMAL)。プロファイル notify_only で切り替える。
  # true: 切り離して (対処 gate)、候補を選んで再初期化し、収束したら戻す
  recovery_enabled: true
  # 切り離してから戻すまで、走行を止めてほしいと要求するか (対処 pause_request が一時停止を出す)
  request_hold: true
  clear_ticks: 5
  isolate_hold_sec: 3.0
  recover_ok_ticks: 5
  recover_timeout_sec: 30.0
  max_reinit_attempts: 3
  degraded_retry_sec: 60.0
  # GNSS が悪いと判断したときは、GNSS の分散を上限にして使わないようにするだけで、走行を止めず、AMCL と EKF の
  # 再初期化もしない (AMCL は別の判定で正しいと分かっている)。GNSS の異常がなくなれば戻る。
  # 地図の歪みによる GNSS のずれは、GNSS の故障ではなく、場所ごとに決まったずれ
  isolate_only: [gnss]

recovery:
  # 再初期化の後に収束したかを見る判定 (すべて正常な周期が recover_ok_ticks 回続けば戻す)
  convergence: [amcl_ekf]

  # 復旧のために残すスキャン (動きでまとめた局所地図。判定の submap_map のバッファとは別)
  scan_buffer: {reference: map_scan, motion: odom}

  # 復旧の候補を作るもの。再初期化が要るあいだ、2 秒ごとに計画する
  generators:
    # 精度の良い GNSS の測位が続いたら、その位置
    gnss:
      type: pose_source
      sources: {pose: gnss}
      params: {max_std_m: 1.0, consecutive: 2, max_age_sec: 3.0}
    # 疑いが始まる前の信頼できた時点 (アンカー) に、その後のオドメトリを足した位置
    dead_reckoning:
      type: anchor_motion
      sources: {motion: odom}
    # 上の位置の周りで、直近のスキャンを地図に照合して見つけた位置 (GNSS がなくても、少しのずれを直せる)
    submap:
      type: submap_match
      sources: {motion: odom, reference: map_scan}
    # AMCL の粒子の仮説のうち、推測航法の姿勢に近いものを、重みの大きい順に (角で誤った向きに収束しても、残った
    # 正しい向きの仮説へ戻す)。遠くの似た場所の仮説は、スキャンの一致が良くても使わない。プロファイル hypotheses で有効にする
    hypotheses:
      type: hypothesis_modes
      sources: {hypotheses: amcl_particles, motion: odom}
      params: {max_candidates: 3, min_weight: 0.05, max_distance_m: 3.0, max_yaw_rad: 0.5}
      enabled: false

  # 候補の評価 (0〜1)。重み付き平均で順位を付ける。
  # スキャンの照合は、廊下のように進行方向の位置が定まらない場所では、似た一致の候補が並ぶ。
  # GNSS との近さと、推測航法の予測との近さを、小さい重みで足して、並んだ候補から選ぶ
  # (GNSS は地図との位置合わせのずれを含み、運ばれたときは推測航法の予測が外れるので、重みを小さくする)
  scorers:
    scan:
      type: scan_match
      sources: {reference: map_scan, motion: odom}
    gnss_agreement:
      type: source_agreement
      sources: {pose: gnss}
      weight: 0.4
    dead_reckoning_agreement:
      type: anchor_agreement
      sources: {motion: odom}
      weight: 0.3
    # 計画用地図の致死セルに footprint がかかる候補は捨てる
    free:
      type: footprint_free
      sources: {reference: planning_map}
      veto_below: 0.5

  # 最良が min_score に届かない、または、離れた次点との差が ambiguity_margin 未満なら再初期化しない。
  # min_score は、この地図で正しい姿勢の一致率 (0.55 以上) より低くする
  selection: {min_score: 0.35, ambiguity_margin: 0.1, separation_m: 1.0, retry_sec: 2.0}

  # 選んだ姿勢の送り先 (AMCL と EKF)。監督が送ったものは、外からの再初期化と見なさない。
  # role は門の置き直しの送り先の役 (推定器 / 融合。門が AMCL を採って EKF だけを直すときは fused だけに送る)
  resetters:
    - {type: amcl, role: estimator}
    - {type: robot_localization, role: fused}

  # 対処。いずれも、プロファイルでは変えられない (起動時に作る)
  actuators:
    # AMCL の出力 (EKF への入力) を、AMCL が疑わしいあいだ止める (ゲートの調停ノードの、監督用の窓口)
    - type: gate
      params: {service: /amcl_gate_arbiter/supervisor/change_publish_state, blames: [amcl, unknown]}
    # 走行を止めてほしいあいだ、シーケンサを一時停止する
    - name: pause_request
      type: "mg_localization_supervisor.actuators.pause_request:PauseRequestActuator"
    # 観測を増やす指示 (observe) が出たら、その場で首を振る (Nav2 の Spin)。指示はプロファイル robust_recovery で出す
    - name: spin_observe
      type: "mg_localization_supervisor.actuators.spin_observe:SpinObserve"
    # 再初期化の後に、グローバルコストマップを消す
    - name: clear_costmap
      type: "mg_localization_supervisor.actuators.clear_costmap:ClearCostmap"
    # GNSS の分散にかける倍率を配信する (GNSS を切り離しているあいだは上限)。slam_gnss_2d の nav_bridge.yaml の
    # variance_scale_topic と同じトピック
    - type: variance_scale
      params: {topic: /gnss_variance_scale, residual: gnss_vs_ekf}
    # 走り方 (conduct) の速度の上限を、controller_server の /speed_limit に出す (門があるときだけ上限が出る)
    - name: speed_limit
      type: "mg_localization_supervisor.actuators.speed_limit:SpeedLimitActuator"
    # センサの組が変わったら、ほかのノードのパラメータを切り替える (センサの途絶の見張りからの引き継ぎ)。
    # LiDAR なしの組では、collision_monitor の scan の途絶による停止を切り、見張りの LiDAR の一時停止を外して、
    # 深度の障害物 (ローカルコストマップ) と組の速度の上限で走る。all は全部の組に戻ったときの値 (設定ファイルと同じ)
    - name: sensor_set
      type: "mg_localization_supervisor.actuators.sensor_set:SensorSetParameters"
      params:
        sets:
          no_lidar:
            /collision_monitor: {scan_top.stop_on_timeout: false}
            /driver_watchdog_node: {pause_exempt_sources: [top_lidar]}
          all:
            /collision_monitor: {scan_top.stop_on_timeout: true}
            # 空の並びは ROS のパラメータの型が決まらないので、どのソースにも当たらない [""] にする
            /driver_watchdog_node: {pause_exempt_sources: [""]}

anchors:
  pose: ekf
  motion: odom
  min_interval_sec: 1.0
  max_age_sec: 120.0
  max_distance_m: 100.0

# 安全の信号: EKF の姿勢の footprint が、計画用地図の占有セルにかかっているか。
# footprint は mg_navigation/params/nav2_params.yaml のコストマップと同じ (テストで確かめている)
safety:
  pose: ekf
  map: planning_map
  footprint: [[0.4, 0.25], [0.4, -0.25], [-0.2, -0.3], [-0.2, 0.3]]

# 残差: 信頼できる周期に、GNSS と EKF の位置の差を残し、GNSS の自己申告の分散より実際の誤差が大きければ、
# 分散にかける倍率を出す (対処 variance_scale が配信し、GNSS のブリッジが /odom/gps の分散にかける)。
# 地図と GNSS のずれは場所ごとに違うので、補正せずに信頼度だけを下げる。倍率が大きい状態が続くと、イベント residual_changed で
# 知らせる (gnss_transform.yaml を見直すきっかけ)。EKF は GNSS を含む融合の結果なので、GNSS を過大に信頼するほど残差は小さく
# 出る。倍率は、ずれが大きい区間を見つけるための目安
residuals:
  gnss_vs_ekf: {a: gnss, b: ekf}

# 起動直後と復旧直後は、EKF・AMCL が落ち着くまで総合しない [s]。
# 外からの再初期化・地図の切り替えの後も、after_reset_sec の間は総合しない
grace:
  startup_sec: 30.0
  after_recovery_sec: 10.0
  after_reset_sec: 10.0

# 監督以外 (GNSS による初期化、watchdog、人の操作) が推定器を初期化し直したら、人による上書きとして扱う
external_reinit:
  topics: [/initialpose, /set_pose]

# 門: AMCL の姿勢を EKF に入れる前に確かめる (localization_supervisor/doc/motion_gate.md)。監督のノードのパラメータ
# use_gate (launch の引数) で有効にする (enabled はここでは書かない)。門があるときは、置き直し・AMCL の門の開閉・
# 一時停止を門が決め、監督の復旧も門の照合で決める (localization_supervisor/doc/design.md)。プロファイルでは
# 変えられない (起動時に作る)。
# 閉じる理由・照合・戻し方の値は、記録の再生の評価で決めた仮の値で、実機で確かめて調整する
# センサの組: LiDAR (map_scan) が missing_after_sec 届かなければ LiDAR なしの組にし、組の速度の上限で走る。
# missing_after_sec は、センサの途絶の見張り (mg_drivers の driver_watchdog.yaml) が起動し直しを試す時間
# (restart_after_sec と restart_cooldown_sec の数回分) より長くする。戻ったら present_after_sec 待って全部の組へ
sensor_sets:
  - name: no_lidar
    missing: [map_scan]
    missing_after_sec: 30.0
    present_after_sec: 5.0
    speed_limit_mps: 0.3

# 走り方: 状況 (確かめた姿勢がない / 疑い / 決めきれない / 見えない / 復旧中) と程度 (起こりうる誤差 ÷ 余裕) から
# 減速を決める (localization_supervisor/doc/architecture_target.md の「状態 × 程度 → 対処」)。門があるときだけ使う。
# 余裕は safety の footprint と計画用地図から求める。止める対処は持たない (止めるのは門と監督の上限つきの仕組み)
conduct:
  # 確かめてから走った道のり 1 m あたりの誤差の増え方。門の continuation_xy_per_m と同じ考え方
  error_per_m: 0.05
  # 状況ごとの起こりうる誤差の下限 [m]
  floors: {uninitialized: 2.0, suspect: 1.0, undecided: 1.5, unobserved: 1.0, recovering: 1.5}
  # 門の確かめ (gate.settings.confirm_distance_m) が 2 回続けて合わなかったくらいの道のり
  unobserved_after_m: 25.0
  undecided_after_sec: 3.0
  medium_ratio: 0.5
  heavy_ratio: 1.0
  lower_hold_sec: 3.0
  # 減速の上限 [m/s]。RPP の desired_linear_vel (巡航) より小さく
  slow_speed_mps: 0.3
  table:
    uninitialized: {light: normal, medium: slow, heavy: slow}
    # 疑いは、余裕が狭いとき (重い) だけ減速する (地図と GNSS のどちらが正しいか見分けられない区間を、開けた所でまで
    # 減速すると、変換の誤差だけの区間をずっと低速で走るため)
    suspect: {light: normal, medium: normal, heavy: slow}
    undecided: {light: slow, medium: slow, heavy: slow}
    unobserved: {light: slow, medium: slow, heavy: slow}
    recovering: {light: slow, medium: slow, heavy: slow}

gate:
  period_sec: 0.2
  settings:
    estimator: amcl
    fused: ekf
    motion: odom
    reference: map_scan
    gnss: gnss
    max_age_sec: 2.0
    gnss_max_age_sec: 2.0
    # GNSS の候補は、申告の精度がこれ以下のときだけ。探す範囲は申告の標準偏差の倍
    gnss_max_std_m: 1.0
    gnss_sigma_k: 3.0
    # 前の続きの候補の探す範囲を広げる量 (確かめてから走った道のり 1 m あたり)。オドメトリの誤差の目安より大きく
    continuation_xy_per_m: 0.05
    continuation_yaw_per_m: 0.01
    # 手動の初期姿勢の候補の探す範囲。人が与える姿勢のおおよその誤差を覆う。照合の範囲の上限
    # (map_match の cap_xy_m・cap_yaw_rad) の中にする
    manual_xy_m: 1.5
    manual_yaw_rad: 0.5
    retry_sec: 2.0
    # 門が開いている間に、AMCL と前の続きを照合して、確かめた姿勢を更新する道のり
    confirm_distance_m: 10.0
    # 置き直しの後は、収束の途中なので閉じる理由を使わない (active_in_grace の部品を除く)。時間は、時間の窓で比べる
    # 閉じる理由 (gate_amcl_window の window_sec + max_gap_sec) より長くする (置き直しの前の標本と比べないため)
    grace_after_reset_m: 1.0
    grace_after_reset_sec: 15.0
    # 融合の結果 (走行に使う姿勢) との差がこれ以下なら、その場で置き直す。超えれば止まってから置き直す
    small_correction_m: 0.3
    small_correction_rad: 0.1
    stopped_speed_mps: 0.05
    stopped_yaw_rate_rps: 0.05
    stopped_sec: 1.0
    correction_hold_max_sec: 10.0
    # 閉じたまま決まらないときの上限 (時間か道のり)。超えたら止めて照合し、決まらなければ解いて少し走らせる。
    # 監督が AMCL の異常を確かめて閉じさせたときは、最初から上限を超えたものとして扱う
    max_closed_sec: 30.0
    max_closed_m: 15.0
    undecided_hold_sec: 10.0
    undecided_drive_m: 5.0
    reset_std_m: 0.1
    reset_std_yaw_rad: 0.05
    # 全周の照合 (initial_search) に使う GNSS: 申告の精度の上限と、続けて満たす標本の数 (初期化ノードと同じ)
    initial_gnss_max_std_m: 5.0
    initial_gnss_consecutive: 2
    # GNSS の見習い期間: 申告の精度が直近の窓の最も悪い値 (gnss_max_std_m より悪い) から ratio 倍以上良くなったら、
    # この時間だけ門は GNSS を使わない (屋根を抜けた直後など、位置はずれたまま申告だけが良くなるため)
    gnss_probation_sec: 10.0
    gnss_probation_ratio: 3.0
    gnss_probation_window_sec: 10.0
    # 決まらずに止めた回数がこれに達した後の停止では、確かめた姿勢の続きの周りを全周の照合 (initial_search) で探す
    wide_search_after_holds: 2

  # 閉じる理由の部品 (判定の書き方)。どれかの異常が close_after_sec 続いたら閉じる。誤って閉じても照合 1 回で戻る。
  # 名前は判定のインスタンスと分ける (状態のメッセージに両方を並べる)
  closers:
    # 1 回ごとの飛び (AMCL の姿勢とホイールオドメトリが示す map->odom の変化)
    gate_amcl_jump:
      type: pose_jump
      sources: {pose: amcl, motion: odom}
      params: {threshold_m: 1.0, threshold_rad: 0.3}
    # 直近の時間の窓での変化 (飛ばされた AMCL が少しずつ戻る・滑るのを見逃さない)
    gate_amcl_window:
      type: pose_jump
      sources: {pose: amcl, motion: odom}
      params: {threshold_m: 1.0, threshold_rad: 0.3, window_sec: 10.0}
    # GNSS と離れたまま (動きの合意では気づけない、ゆっくりしたずれ)。精度の良い GNSS だけを使う。
    # 今の AMCL と今の GNSS を比べ、置き直しの前の標本を使わないので、置き直しの後の猶予の間も使う。
    # 監督が GNSS を疑っている間は使わない
    gate_amcl_gnss:
      type: pose_consistency
      sources: {a: amcl, b: gnss}
      params: {metric: distance, threshold: 1.5, b_max_std_m: 0.5}
      close_after_sec: 3.0
      active_in_grace: true

  map_match:
    min_ratio: 0.35
    margin: 0.1
    separation_m: 1.0
    separation_yaw_rad: 0.2
    narrow_xy_m: 0.5
    narrow_yaw_rad: 0.15
    step_xy_m: 0.1
    step_yaw_rad: 0.05
    cap_xy_m: 2.0
    cap_yaw_rad: 0.55
    wide_step_xy_m: 0.25
    wide_step_yaw_rad: 0.1
    tolerance_m: 0.3
    coarse_tolerance_m: 0.5
    coarse_candidates: 5
    max_points: 400
    field_radius_m: 25.0

  # 照合に使う、直近のスキャンを重ねたもの
  scan_buffer:
    keyframe_distance_m: 0.3
    keyframe_angle_rad: 0.2
    window_distance_m: 3.0
    max_points_per_scan: 90
    max_range_m: 25.0

  # 確かめた姿勢がない間 (起動の直後、地図の切り替えの後) に、GNSS の周りを向きの全周で照合した姿勢を候補に足す。
  # 推定器と別の仮説に置き直すのは、この姿勢と同じ仮説に決まったときだけ。合わなければ、最初の 1 回だけ GNSS の
  # 位置を広い共分散で出す (AMCL に広く探させる)。GNSS の精度の条件は settings の initial_gnss_*。
  # 値は GNSS による初期化ノード (initializer.yaml、verify.*) の照合と同じ
  initial_search:
    search_range_m: 4.0
    step_xy_m: 0.5
    step_yaw_rad: 0.1
    scan_radius_m: 15.0
    tolerance_m: 0.15
    coarse_tolerance_m: 0.4
    coarse_candidates: 8
    min_points: 30
    min_ratio: 0.5
    ambiguity_margin: 0.1
    separation_m: 1.0
    matched_std_m: 0.3
    matched_std_yaw_rad: 0.1
    fallback_std_m: 2.0
    fallback_std_yaw_rad: 0.5

  # 手動の初期姿勢の専用トピック (Web UI が送る。門がないときは、launch の中継がそのまま /initialpose へ送る)
  manual_pose_topic: /localization/manual_initial_pose

events:
  prefix: localization
  sink: {type: "mg_localization_supervisor.event_sinks.event_log:EventLogSink"}

output:
  status_topic: /localization/status
  diagnostic_name: localization
  hardware_id: localization

profiles:
  # AMCL と GNSS が乖離したら GNSS で引き戻すだけの動作
  gnss_fallback: profiles/gnss_fallback.yaml
  # 検知と通知だけ (自動復旧しない。watchdog と並行して動かすときに使う)
  notify_only: profiles/notify_only.yaml
  # 復旧の候補に、AMCL の粒子の仮説を足す
  hypotheses: profiles/hypotheses.yaml
  # 止まったままでも確かめて戻り、決められなければ首を振って観測を増やす復旧
  robust_recovery: profiles/robust_recovery.yaml
  # シナリオ試験で /initialpose から故障を注入するとき (実機では使わない)
  fault_injection: profiles/fault_injection.yaml
