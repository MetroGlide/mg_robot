# このロボットの、自己位置の監督の構成 (localization_supervisor の設定ファイル)。
# 情報源 (AMCL・GNSS・EKF・ホイールオドメトリ・地図とスキャン・計画用地図)、判定のインスタンス、総合、状態遷移、
# アンカー、安全の信号、出力。書き方は localization_supervisor/doc/parameters.md。
# オフライン評価 (tools/scripts/eval_localization_offline.py) もこのファイルを読む。
version: 1

# 判定と総合の周期 [s]
period_sec: 1.0

sources:
  amcl:
    kind: pose
    input: {type: pose_with_covariance, topic: /amcl_pose_origin}
  gnss:
    kind: pose
    input: {type: odometry, topic: /odom/gps}
  # EKF は AMCL・GNSS・オドメトリを融合した結果。疑わしい情報源の特定には使わず、出力が汚れているかの判定に使う
  ekf:
    kind: pose
    derived_from: [amcl, gnss, odom]
    input: {type: odometry, topic: /ekf_global_odom}
  odom:
    kind: motion
    input: {type: odometry, topic: /odom}
  map_scan:
    kind: reference
    input: {type: map_scan, map_topic: /map, scan_topic: /scan_top_lidar, base_frame: base_footprint}
  # 計画用地図 (グローバルコストマップの静的な層と同じ地図)。安全の信号にだけ使う
  planning_map:
    kind: reference
    input: {type: occupancy_grid, topic: /planning_map}

timeline:
  motion_priority: [odom]
  horizon_sec: 30.0

# 累積 (cusum) は、score が allowance を超えた分をためる。正常なときの score がしきい値 (1.0) より十分小さい判定は、
# allowance を 1.0 より下げて、しきい値の手前からためる (少しずつずれる場合に早く気づく)。
# allowance は、オフライン評価の正常なときの score の分布 (判定ごとの最大値) より上にする
detectors:
  # AMCL と GNSS の位置の差のマハラノビス距離の二乗 (2 自由度)。標準偏差が b_max_std_m を超える GNSS は使わない。
  # 単独測位 (σ 約 1 m) でも、AMCL が数 m ずれれば食い違いとして検知できる
  amcl_gnss:
    type: pose_consistency
    sources: {a: amcl, b: gnss}
    params: {threshold: 6.0, b_max_std_m: 2.0, extra_std_m: 0.3}
    allowance: 0.6
  # EKF と GNSS。EKF が引きずられた (汚れた) かを見る
  ekf_gnss:
    type: pose_consistency
    sources: {a: ekf, b: gnss}
    params: {threshold: 6.0, b_max_std_m: 2.0, extra_std_m: 0.3}
    allowance: 0.6
  # AMCL と EKF の位置の差 [m]。復旧の収束の確認にも使う
  amcl_ekf:
    type: pose_consistency
    sources: {a: amcl, b: ekf}
    params: {metric: distance, threshold: 1.0}
    allowance: 0.6
  # 連続する AMCL の推定が示す map->odom の飛び
  amcl_jump:
    type: pose_jump
    sources: {pose: amcl, motion: odom}
    params: {threshold_m: 0.6, threshold_rad: 0.35}
    max_score: 10.0
  # EKF の姿勢でのスキャンと地図の一致。一致率の絶対値は地図の質や LiDAR の特性で決まる (正しい姿勢でも
  # 0.3 前後のことがある) ので、正常なときの中央値を基準にする。利得 (ずらしたほうが合う) は、別走行の地図との
  # 位置合わせのずれで正しい姿勢でも 0.4 前後になるため使わない (gain_threshold 1.0)
  scan_ekf:
    type: scan_map
    sources: {pose: ekf, reference: map_scan}
    params: {tolerance_m: 0.3, ratio_min: 0.1, ratio_factor: 0.5, gain_threshold: 1.0}
    decay: 0.9
  # AMCL の姿勢でのスキャンと地図の一致。AMCL は同じスキャンと地図で推定しているので独立ではない
  # (誤った場所に収束していても一致率は良く見えやすい) ため、重みを下げる
  scan_amcl:
    type: scan_map
    sources: {pose: amcl, reference: map_scan}
    params: {tolerance_m: 0.3, ratio_min: 0.1, ratio_factor: 0.5, gain_threshold: 1.0}
    weight: 0.5
    decay: 0.9
  # AMCL の自己申告の共分散 (x・y の分散の和)。watchdog と同じ判定
  amcl_covariance:
    type: covariance
    sources: {pose: amcl}
    params: {metric: trace_xy, threshold: 2.0}
    weight: 0.5
  # 直近の走行のスキャンを動きで局所地図にまとめ、地図に照合する (5 秒ごと)。1 枚のスキャンより広い範囲を見るので、
  # GNSS が使えず、AMCL が誤った場所に収束して EKF も引きずられたときに効く。正しい姿勢での一致率 (この地図で
  # 0.55 以上) より低い ratio_min と、正しい姿勢での利得 (0.4 弱まで) より高い gain_threshold にする
  submap_ekf:
    type: submap_map
    sources: {pose: ekf, motion: odom, reference: map_scan}
    params: {ratio_min: 0.35, baseline_min_samples: 5, gain_threshold: 0.5}
    allowance: 0.8
  submap_amcl:
    type: submap_map
    sources: {pose: amcl, motion: odom, reference: map_scan}
    params: {ratio_min: 0.35, baseline_min_samples: 5, gain_threshold: 0.5}
    allowance: 0.8
  # 次の 2 つは、この環境 (屋外。別の走行で作った地図) のオフライン評価で、正しい姿勢でも異常と区別できなかった
  # ため無効にしている。光線が地図の占有セルを越える割合が正しい姿勢でも 2〜7 割あり (植栽や柵の向こうが見える)、
  # ずらしたほうが合う向きも、地図の位置合わせのずれで場所ごとに一定の向きにそろう
  freespace_ekf:
    type: freespace
    sources: {pose: ekf, reference: map_scan}
    enabled: false
  drift_ekf:
    type: scan_drift
    sources: {pose: ekf, reference: map_scan}
    enabled: false

fusion:
  type: cusum
  params: {suspect_level: 1.0, confirm_level: 4.0, blame_margin: 1.0}

# アンカーを残す条件: 状態が NORMAL で、判定がどれも異常でなく、ここに並べた判定が正常
trust:
  require_normal: [scan_ekf]

state_machine:
  # false: 検知と通知だけ (異常を確認したら DEGRADED、消えたら NORMAL)。
  # true: 切り離して (対処 gate)、候補を選んで再初期化し、収束したら戻す。プロファイル recovery で有効にする
  recovery_enabled: false
  # 切り離してから戻すまで、走行を止めてほしいと要求するか (対処 pause_request が一時停止を出す)
  request_hold: true
  clear_ticks: 5
  isolate_hold_sec: 3.0
  recover_ok_ticks: 5
  recover_timeout_sec: 30.0
  max_reinit_attempts: 3
  degraded_retry_sec: 60.0

recovery:
  # 再初期化の後に収束したかを見る判定 (すべて正常な周期が recover_ok_ticks 回続けば戻す)
  convergence: [amcl_ekf]

  # 復旧のために残すスキャン (動きでまとめた局所地図。判定の submap_map のバッファとは別)
  scan_buffer: {reference: map_scan, motion: odom}

  # 復旧の候補を作るもの。再初期化が要るあいだ、2 秒ごとに計画する
  generators:
    # 精度の良い GNSS の測位が続いたら、その位置
    gnss:
      type: pose_source
      sources: {pose: gnss}
      params: {max_std_m: 1.0, consecutive: 2, max_age_sec: 3.0}
    # 疑いが始まる前の信頼できた時点 (アンカー) に、その後のオドメトリを足した位置
    dead_reckoning:
      type: anchor_motion
      sources: {motion: odom}
    # 上の位置の周りで、直近のスキャンを地図に照合して見つけた位置 (GNSS がなくても、少しのずれを直せる)
    submap:
      type: submap_match
      sources: {motion: odom, reference: map_scan}

  # 候補の評価 (0〜1)。重み付き平均で順位を付ける。
  # スキャンの照合は、廊下のように進行方向の位置が定まらない場所では、似た一致の候補が並ぶ。
  # GNSS との近さと、推測航法の予測との近さを、小さい重みで足して、並んだ候補から選ぶ
  # (GNSS は地図との位置合わせのずれを含み、運ばれたときは推測航法の予測が外れるので、重みを小さくする)
  scorers:
    scan:
      type: scan_match
      sources: {reference: map_scan, motion: odom}
    gnss_agreement:
      type: source_agreement
      sources: {pose: gnss}
      weight: 0.4
    dead_reckoning_agreement:
      type: anchor_agreement
      sources: {motion: odom}
      weight: 0.3
    # 計画用地図の致死セルに footprint がかかる候補は捨てる
    free:
      type: footprint_free
      sources: {reference: planning_map}
      veto_below: 0.5

  # 最良が min_score に届かない、または、離れた次点との差が ambiguity_margin 未満なら再初期化しない。
  # min_score は、この地図で正しい姿勢の一致率 (0.55 以上) より低くする
  selection: {min_score: 0.35, ambiguity_margin: 0.1, separation_m: 1.0, retry_sec: 2.0}

  # 選んだ姿勢の送り先 (AMCL と EKF)。監督が送ったものは、外からの再初期化と見なさない
  resetters:
    - {type: amcl}
    - {type: robot_localization}

  # 対処。いずれも、プロファイルでは変えられない (起動時に作る)
  actuators:
    # AMCL の出力 (EKF への入力) を、AMCL が疑わしいあいだ止める (ゲートの調停ノードの、監督用の窓口)
    - type: gate
      params: {service: /amcl_gate_arbiter/supervisor/change_publish_state, blames: [amcl, unknown]}
    # 走行を止めてほしいあいだ、シーケンサを一時停止する
    - {type: "mg_localization_supervisor.actuators.pause_request:PauseRequestActuator"}
    # 再初期化の後に、グローバルコストマップを消す
    - {type: "mg_localization_supervisor.actuators.clear_costmap:ClearCostmap"}

anchors:
  pose: ekf
  motion: odom
  min_interval_sec: 1.0
  max_age_sec: 120.0
  max_distance_m: 100.0

# 安全の信号: EKF の姿勢の footprint が、計画用地図の占有セルにかかっているか。
# footprint は mg_navigation/params/nav2_params.yaml のコストマップと同じ (テストで確かめている)
safety:
  pose: ekf
  map: planning_map
  footprint: [[0.4, 0.25], [0.4, -0.25], [-0.2, -0.3], [-0.2, 0.3]]

# 起動直後と復旧直後は、EKF・AMCL が落ち着くまで総合しない [s]。
# 外からの再初期化・地図の切り替えの後も、after_reset_sec の間は総合しない
grace:
  startup_sec: 30.0
  after_recovery_sec: 10.0
  after_reset_sec: 10.0

# 監督以外 (GNSS による初期化、watchdog、人の操作) が推定器を初期化し直したら、人による上書きとして扱う
external_reinit:
  topics: [/initialpose, /set_pose]

events:
  prefix: localization
  sink: {type: "mg_localization_supervisor.event_sinks.event_log:EventLogSink"}

output:
  status_topic: /localization/status
  diagnostic_name: localization
  hardware_id: localization

profiles:
  # AMCL と GNSS が乖離したら GNSS で引き戻すだけの動作
  gnss_fallback: profiles/gnss_fallback.yaml
  # 判定ごとに続けて異常だった回数で判断する (今の監督ノードと同じ判定と回数)
  consecutive: profiles/consecutive.yaml
  # 自動復旧を有効にする (判定は基の設定のまま)
  recovery: profiles/recovery.yaml
