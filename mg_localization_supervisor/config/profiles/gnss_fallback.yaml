# AMCL と GNSS が乖離したら GNSS で引き戻すだけの動作 (supervision.yaml に重ねる)。
# 判定は AMCL と GNSS の食い違いだけで、続けて異常だった回数で判断する。
# 候補は、精度の良い GNSS の測位が続いたときの位置だけ (評価も決めきれないときの見送りもない)。
# 切り離しも一時停止もせず、異常を確認したらすぐ AMCL と EKF を初期化し直す。
enabled_detectors: [amcl_gnss]

detectors:
  amcl_gnss:
    options: {suspect_after: 2, confirm_after: 3}

fusion:
  type: consecutive
  params: {blame_margin: 1.0}

trust:
  require_normal: []

# GNSS の分散に倍率をかけない (以前の動作には無かった)
residuals:
  gnss_vs_ekf: {max_scale: 1.0}

state_machine:
  recovery_enabled: true
  request_hold: false
  isolate_hold_sec: 0.0
  isolate_only: []

recovery:
  convergence: [amcl_gnss]
  # 以前の動作には無かった対処は働かせない
  disabled_actuators: [pause_request, clear_costmap, variance_scale]
  generators:
    gnss:
      params: {max_std_m: 5.0, consecutive: 2, min_std_m: 0.5, yaw_std_rad: 0.26}
    dead_reckoning: {enabled: false}
    submap: {enabled: false}
  scorers:
    scan: {enabled: false}
    gnss_agreement: {enabled: false}
    dead_reckoning_agreement: {enabled: false}
    free: {enabled: false}
