x-runtime-base: &runtime-base
  build:
    context: .
    dockerfile: "docker/Dockerfile.base"
    args:
      ROS_DISTRO: humble
    target: runtime
  image: mg_runtime
  tty: true
  network_mode: "host"
  privileged: true
  env_file:
    - .env
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:/root/.Xauthority
    - ./:/app/
    - /dev:/dev
    - ${HOME}/ros2_data:/root/ros2_data

x-develop-base: &develop-base
  build:
    context: .
    dockerfile: "docker/Dockerfile.base"
    args:
      ROS_DISTRO: humble
    target: develop
  image: mg_develop
  tty: true
  network_mode: "host"
  privileged: true
  env_file:
    - .env
  environment:
    - DISPLAY=${DISPLAY}
    - PYTHONUNBUFFERED=1
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:/root/.Xauthority
    - ./:/app/
    - /dev:/dev
    - ${HOME}/ros2_data:/root/ros2_data

x-simulation-base: &simulation-base
  build:
    context: .
    dockerfile: "docker/Dockerfile.base"
    args:
      ROS_DISTRO: humble
    target: simulation
    network: host
  image: mg_simulation
  tty: true
  network_mode: "host"
  privileged: true
  env_file:
    - .env
  environment:
    - DISPLAY=${DISPLAY}
    - PYTHONUNBUFFERED=1
    - SIMULATION=true
    - IGN_GAZEBO_RESOURCE_PATH=/root/.ignition/fuel
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:/root/.Xauthority
    - ./:/app/
    - /dev:/dev
    - ${HOME}/ros2_data:/root/ros2_data
    - ${HOME}/.ignition:/root/.ignition

services:
  slam:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - USE_RVIZ=false
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_bringup bringup_slam_toolbox.launch.py ${OPTS:-}
      "

  slam-gnss-2d:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SIMULATION=${SIMULATION:-false}
      - USE_RVIZ=${USE_RVIZ:-false}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch slam_gnss_2d bringup_slam_gnss_2d.launch.py ${OPTS:-}
      "

  offline-slam-gnss-2d:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - ROSBAG_FILE=${ROSBAG_FILE}
      - USE_RVIZ=${USE_RVIZ:-false}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_bringup offline_slam_gnss_2d.launch.py ${OPTS:-}
      "

  reoptimize-slam:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - INPUT_DIR=${INPUT_DIR:-}
      - BAG_PATH=${BAG_PATH:-}
      - SAVE_DIR=${SAVE_DIR:-}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch slam_gnss_2d reoptimize.launch.py input_dir:=$$INPUT_DIR $${BAG_PATH:+bag_path:=$$BAG_PATH} $${SAVE_DIR:+save_dir:=$$SAVE_DIR} ${OPTS:-}
      "

  navigation:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - USE_RVIZ=false
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_bringup bringup_navigation.launch.py ${OPTS:-}
      "

  rosbag-replay:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SIMULATION=true
      - USE_RVIZ=false
      - ROSBAG_FILE=${ROSBAG_FILE}
      - ROSBAG_TOPICS=${ROSBAG_TOPICS:-}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 bag play $$ROSBAG_FILE $${ROSBAG_TOPICS:+--topics $$ROSBAG_TOPICS} --clock ${OPTS:-}
      "

  obstacle-detection-replay:
    <<: *develop-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SIMULATION=true
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_drivers obstacle_detection_replay.launch.py ${OPTS:-}
      "

  map-preview:
    <<: *runtime-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SLAM_MAP_DIR=${SLAM_MAP_DIR}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_slam map_preview.launch.py slam_map_dir:=$$SLAM_MAP_DIR
      "

  gazebo-simulation:
    <<: *simulation-base
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_simulation bringup.launch.py ${OPTS:-}
      "

  scenario-test:
    <<: *simulation-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SIMULATION=true
      - IGN_GAZEBO_RESOURCE_PATH=/root/.ignition/fuel
      - SCENARIO_FILE=${SCENARIO_FILE:-/app/mg_scenario_test/scenarios/example_inline_goals.yaml}
    command: |
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_scenario_test scenario_test.launch.py scenario_file:=$$SCENARIO_FILE ${OPTS:-}
      "

  scenario-test-full:
    <<: *simulation-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - SIMULATION=true
      - IGN_GAZEBO_RESOURCE_PATH=/root/.ignition/fuel
      - SCENARIO_FILE=${SCENARIO_FILE:-/app/mg_scenario_test/scenarios/example_inline_goals.yaml}
      - HEADLESS=${HEADLESS:-true}
    command: |
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_scenario_test scenario_test.launch.py \
          scenario_file:=$$SCENARIO_FILE ${OPTS:-}
      "

  develop:
    <<: *develop-base
    command: "/app/docker/docker-entrypoint.sh"

  rviz2-slam:
    <<: *develop-base
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        rviz2 --display-config /app/mg_slam/rviz/rviz.rviz
      "

  rviz2-slam-gnss-2d:
    <<: *develop-base
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        rviz2 --display-config /app/slam_gnss_2d/slam_gnss_2d/rviz/slam_gnss_2d.rviz
      "

  rviz2-navigation:
    <<: *develop-base
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        rviz2 --display-config /app/mg_navigation/rviz/rviz.rviz
      "

  rviz2:
    <<: *develop-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - RVIZ_CONFIG=${RVIZ_CONFIG:-}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        rviz2 $${RVIZ_CONFIG:+--display-config $$RVIZ_CONFIG}
      "

  diagnostics:
    <<: *runtime-base
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_diagnostics diagnostics.launch.py
      "

  waypoint-editor:
    <<: *develop-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_waypoint_navigation waypoint_editor.launch.py
      "

  system-manager:
    <<: *develop-base
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - PROJECT_DIR=/app
      - HOST_PROJECT_DIR=${PWD}
      - HOST_HOME=${HOME}
      - SIMULATION_WORLD=warehouse
      - SIMULATION_ROBOT_NAME=mg
      - UI_DATA_DIR=/root/ros2_data/mg_ui_local
      - SYSTEM_MANAGER_ALLOW_ORIGINS=http://localhost:8080,http://localhost:5173
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - ./:/app/
      - ${PWD}:${PWD}
      - /dev:/dev
      - ${HOME}/ros2_data:/root/ros2_data
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
        python3 /app/mg_ui/mg_system_manager/scripts/system_manager_app.py
      "

  foxglove-bridge:
    <<: *runtime-base
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 run foxglove_bridge foxglove_bridge
          --ros-args
          -p port:=8765
          -p address:=0.0.0.0
          -p send_buffer_limit:=10000000
          -p use_sim_time:=false
      "

  web-ui:
    build:
      context: .
      dockerfile: "docker/Dockerfile.base"
      args:
        ROS_DISTRO: humble
      target: web-ui
    image: mg_web_ui
    tty: true
    network_mode: "host"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source /root/ros2_ws/install/setup.bash &&
        ros2 launch mg_web_ui web_ui.launch.py
      "

  web-ui-dev:
    image: node:20-slim
    network_mode: "host"
    volumes:
      - ./mg_ui/mg_web_ui/frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
