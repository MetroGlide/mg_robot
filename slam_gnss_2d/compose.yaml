volumes:
  slam_build:
  slam_install:

services:
  slam-gnss-2d:
    build:
      context: .
      target: dev
    network_mode: host
    privileged: true
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      - .:/app
      - slam_build:/root/ros2_ws/build
      - slam_install:/root/ros2_ws/install
      - ${HOST_DATA_DIR:-${HOME}/ros2_data}:/root/ros2_data
    working_dir: /root/ros2_ws
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch slam_gnss_2d bringup_slam_gnss_2d.launch.py
      "

  offline-slam:
    build:
      context: .
      target: dev
    network_mode: host
    privileged: true
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY}
      - ROSBAG_FILE=${ROSBAG_FILE}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      - .:/app
      - slam_build:/root/ros2_ws/build
      - slam_install:/root/ros2_ws/install
      - ${HOST_DATA_DIR:-${HOME}/ros2_data}:/root/ros2_data
    working_dir: /root/ros2_ws
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch slam_gnss_2d offline_slam_gnss_2d.launch.py bag_path:=$${ROSBAG_FILE}
      "

  reoptimize:
    build:
      context: .
      target: dev
    network_mode: host
    env_file:
      - .env
    environment:
      - INPUT_DIR=${INPUT_DIR}
      - ROSBAG_FILE=${ROSBAG_FILE}
      - SAVE_DIR=${SAVE_DIR}
    volumes:
      - .:/app
      - slam_build:/root/ros2_ws/build
      - slam_install:/root/ros2_ws/install
      - ${HOST_DATA_DIR:-${HOME}/ros2_data}:/root/ros2_data
    working_dir: /root/ros2_ws
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch slam_gnss_2d reoptimize.launch.py input_dir:=$${INPUT_DIR} $${ROSBAG_FILE:+bag_path:=$$ROSBAG_FILE} $${SAVE_DIR:+save_dir:=$$SAVE_DIR}
      "

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - slam_build:/root/ros2_ws/build
      - slam_install:/root/ros2_ws/install
    working_dir: /root/ros2_ws
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        colcon test --packages-select slam_gnss_2d &&
        colcon test-result --all
      "

  dev:
    build:
      context: .
      target: dev
    network_mode: host
    privileged: true
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      - .:/app
      - slam_build:/root/ros2_ws/build
      - slam_install:/root/ros2_ws/install
      - ${HOST_DATA_DIR:-${HOME}/ros2_data}:/root/ros2_data
    working_dir: /root/ros2_ws
    command: bash
