slam_gnss_nav_bridge:
  ros__parameters:
    gnss_input: navpvt
    gnss_topic: /navpvt
    heading_source: computed
    # この距離 [m] 以上動くまで、次の測位を出さない
    min_publish_distance: 1.0
    # アンテナ位置を車体中心 (base_footprint) の位置に直して出す。
    # lever_arm_x / y は URDF の base_footprint -> gps_link のずれと合わせる
    lever_arm_compensation: true
    lever_arm_x: 0.26
    lever_arm_y: -0.13
    # /odom/gps のスタンプを now() からこの秒数だけ過去にする (測位が届くまでの遅れの補正)
    time_offset_sec: 0.0
    # 解の種類ごとに、分散 = max(hAcc, 下限)^2 * 係数 とする。
    # 係数 1.44 = 1.2^2 は SLAM の gnss.navpvt_hacc_scale (標準偏差を hAcc の 1.2 倍) に合わせた値
    fix_floor_m: 0.02
    fix_scale: 1.44
    float_floor_m: 0.02
    float_scale: 1.44
    single_floor_m: 0.02
    single_scale: 1.44
    # false にすると、搬送波位相の解が無い (単独測位) 測位を使わない
    accept_single: true
    # 位置の分散の 2 倍がこの値 [m^2] を超える測位は使わない (49.0 は標準偏差 約 4.95 m)
    max_covariance_threshold: 49.0
    # 自己位置の監督が、GNSS と EKF の残差から求めた分散の倍率 (std_msgs/Float64) を受け取るトピック
    # (mg_localization_supervisor の supervision.yaml の variance_scale と同じ)。
    # 地図と GNSS のずれは場所ごとに違うので、補正せずに信頼度だけを下げる。空にすると受け取らない
    variance_scale_topic: /gnss_variance_scale
    # 倍率を最後に受け取ってから、この秒数を過ぎたら 1 に戻す (監督が止まっても、GNSS を弱いままにしない)
    variance_scale_timeout_sec: 10.0
    variance_scale_max: 100.0
