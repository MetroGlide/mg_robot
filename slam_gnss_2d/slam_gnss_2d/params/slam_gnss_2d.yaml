/**:
  ros__parameters:
    topics:
      scan: "/scan_top_lidar"
      odom: "/odom"

    map:
      resolution: 0.05
      expansion_margin: 100.0
      publish_hz: 0.3
      renderer: "counting" # "overwrite" | "counting"
      hit_threshold: 0.3
      min_hits: 1

    keyframe:
      min_translation: 0.2
      min_rotation: 0.1

    # スキャンマッチング（フロントエンド）設定
    scan_matching:
      enabled: true
      # enabled: false
      type: "icp" # "icp" | "ndt"
      reference: "scan_to_local_map" # "scan_to_scan" | "scan_to_local_map"
      max_failure_streak: 5
      yaw_information_multiplier: 1.0 # 過剰拘束を防ぎGNSS位置補正と自然に調和させる倍率
      icp:
        max_iterations: 100
        tolerance: 0.001
        max_correspondence_dist: 2.0
        robust_kernel: "huber"
        robust_kernel_scale: 0.15 # 収束安定化のため 0.05 から 0.15 に緩和
      ndt:
        cell_size: 1.0
        cell_sizes: [2.0, 1.0, 0.5]
        use_bilinear: true
      csm:
        linear_search_window: 1.0
        angular_search_window: 0.5
        linear_step: 0.05
        angular_step: 0.02
      local_map:
        window: 100
        radius: 50.0

    # ループクロージャ設定
    loop_closure:
      # enabled: true
      enabled: false
      search_radius: 4.0
      min_node_gap: 50
      max_failure_streak: 3
      matcher_type: "icp"
      yaw_information_multiplier: 100.0 # ループクロージャの直進性強調倍率
      icp:
        max_iterations: 100
        tolerance: 0.001
        max_correspondence_dist: 1.0
        robust_kernel: "huber"
        robust_kernel_scale: 0.05 # 0.1から厳格化
      ndt:
        cell_size: 1.0
        cell_sizes: [2.0, 1.0, 0.5]
        use_bilinear: true
      csm:
        linear_search_window: 1.0
        angular_search_window: 0.5
        linear_step: 0.05
        angular_step: 0.02
      max_dyaw_deg: 145.0
      crossing_reject_deg: 45.0
      submap_radius: 5.0
      max_score: 0.05

    # GNSS設定
    gnss:
      enabled: true
      # enabled: false
      source: "navpvt" # "navsat_fix" | "navpvt"
      topics:
        fix: "/gps/fix"
        navpvt: "/navpvt"
      navpvt_hacc_scale: 5.0
      validation:
        max_sigma_m: 30.0
        missing_grace_frames: 30
      anchor:
        min_fix_status: 0
        sigma_m: 0.05
        init_yaw_sigma_rad: 10.0
        init_distance_m: 2.0
      sigma:
        fix_m: 0.2 # 0.02から緩和（ガチガチのピン留めを防ぐ）
        float_m: 1.0 # 0.5から緩和
        factor_yaw_variance: 100000000.0

    # バックエンド最適化設定
    optimization:
      backend: "gtsam" # "isam2" | "gtsam"
      incremental: true
      optimize_every_n_loops: 3
      rerender_threshold_m: 0.1
      isam2:
        relinearize_threshold: 0.1

    # 軌跡ベースノイズ除去設定
    trajectory_noise_filter:
      enabled: false
      type: "attenuate" # "clear" | "attenuate"
      radius_m: 1.0

slam_gnss_2d_offline_node:
  ros__parameters:
    offline_step_hz: 0.3 # 可視化速度 [Hz]。0 以下で最大速度

reoptimize_node:
  ros__parameters:
    enable_re_scan_matching: false # シーケンシャルエッジの再マッチングを行わない
    enable_new_loop_search: false # 新規ループ探索のみ有効化
    multi_guess_shift_m: 0.0
    multi_guess_shift_deg: 0.0

    # --- オフライン専用高精度設定（/**:の値を上書き）---
    # シーケンシャルエッジ再マッチング用（高精度NDT）
    scan_matching.type: "ndt"
    scan_matching.reference: "scan_to_local_map"
    scan_matching.icp.max_iterations: 500
    scan_matching.icp.tolerance: 0.000001
    scan_matching.ndt.cell_sizes: [0.5, 0.2]

    # ループエッジ再マッチング用（高精度ICP）
    loop_closure.icp.max_iterations: 500
    loop_closure.icp.tolerance: 0.000001
    loop_closure.icp.max_correspondence_dist: 0.5

    # 新規ループ探索用（オンラインより広い探索範囲）
    loop_closure.search_radius: 5.0
    loop_closure.min_node_gap: 50

    trajectory_noise_filter.enabled: true
