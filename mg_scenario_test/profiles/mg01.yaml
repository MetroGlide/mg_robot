# MG-01 用ロボットプロファイル (sim_scenario_test)
# 項目の詳細は sim_scenario_test/docs/profile_reference.md を参照。
name: mg01
plugins:
  - mg_scenario_test.plugins

sim:
  backend: gazebo_fortress
  robot_entity: mg
  robot_spawn_z: 0.05
  launch:
    package: mg_simulation
    file: launch/bringup.launch.py
    args:
      world: "{world.sdf}"
      headless: "{headless}"

stack:
  package: mg_bringup
  file: launch/navigation/bringup_navigation.launch.py
  args:
    map_path: "{world.localization_map}"
    planning_map_path: "{world.planning_map}"
    waypoints_load_path: "{world.waypoints}"
    # sim の GNSS (Gazebo の navsat) を、ワールドごとの gnss_transform.yaml で地図座標に直して EKF に入れる
    use_slam_gnss_bridge: "true"
    gnss_transform_file: "{world.gnss_transform}"
    bridge_params_file: pkg://mg_simulation/config/nav_bridge_sim.yaml
    rviz: "false"

frames:
  map: map
  base: base_footprint
  # Gazebo ワールド原点と地図原点は一致させている
  map_in_world: {x: 0.0, y: 0.0, yaw: 0.0}

robot:
  # nav2_params.yaml の footprint (padding なしの実寸)
  footprint: [[0.4, 0.3], [0.4, -0.3], [-0.2, -0.3], [-0.2, 0.3]]

readiness:
  timeout_sec: 180.0
  lifecycle_managers:
    - lifecycle_manager_localization
    - lifecycle_manager_navigation

worlds:
  warehouse:
    sim_world: warehouse
    sdf: pkg://mg_simulation/worlds/warehouse.sdf
    localization_map: pkg://mg_simulation/maps/warehouse/localization.yaml
    planning_map: pkg://mg_simulation/maps/warehouse/planning.yaml
    waypoints: pkg://mg_simulation/maps/warehouse/waypoints.yaml
    gnss_transform: pkg://mg_simulation/maps/warehouse/gnss_transform.yaml   # tools/scripts/make_sim_gnss_transform.py で生成
