# MG-01 用ロボットプロファイル (sim_scenario_test)
# 項目の詳細は sim_scenario_test/docs/profile_reference.md を参照。
name: mg01
plugins:
  - mg_scenario_test.plugins

sim:
  backend: gazebo_fortress
  robot_entity: mg
  robot_spawn_z: 0.05
  launch:
    package: mg_simulation
    file: launch/bringup.launch.py
    args:
      world: "{world.sdf}"

stack:
  package: mg_bringup
  file: launch/navigation/bringup_navigation.launch.py

frames:
  map: map
  base: base_footprint
  # Gazebo ワールド原点と地図原点は一致させている
  map_in_world: {x: 0.0, y: 0.0, yaw: 0.0}

readiness:
  timeout_sec: 180.0
  lifecycle_managers:
    - lifecycle_manager_localization
    - lifecycle_manager_navigation

worlds:
  warehouse:
    sim_world: warehouse
    sdf: pkg://mg_simulation/worlds/warehouse.sdf
    waypoints: /root/ros2_data/map/waypoint.yaml
