version: "2.0"
name: collision_temporary_block
description: >
  collision_monitor (PolygonStop/PolygonApproach) が至近距離の障害物で停止し、障害物が
  movement_time_allowance (nav2_params.yaml の progress_checker、現在 5.0 秒) 以内に
  解消すれば、バックアップ等のリカバリーを行わずに走行を再開できることを確認する。
profile: mg01
world: warehouse
tags: [collision, known_issue]

# 既知の問題: 現在の Nav2 設定では、障害物の出現直後 (約 1 秒以内) に controller が
# 'Controller patience exceeded' で FollowPath を中断し、collision_monitor の STOP や
# progress_checker の許容時間より先に BackUp 等のリカバリーが始まる。そのため、この
# シナリオは意図した挙動 (STOP して待つだけで再開) を満たさず FAILED になる。
# 挙動を修正したら known_issue タグを外して smoke に戻すこと。
#
# 判定: 全 waypoint への到達に加え、collision_monitor の STOP が発動したこと、
# BackUp が発火しなかったこと (バックアップなしで走行を再開できたこと) を自動判定する。

obstacles:
  person_blocking:
    model: { type: fuel, uri: "OpenRobotics/models/MaleVisitorOnPhone" }

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

run:
  mg_sequencer:
    start_index: 0

timeline:
  # 走行開始 5 秒後、ロボット直前 (footprint 前端からおよそ 0.5m 以内) に障害物を出現させ、
  # movement_time_allowance より短い 3 秒で退避させる
  - name: temporary_block
    when: { goal_started: { index: 0 } }
    do:
      - delay: { sec: 5.0 }
      - spawn: { obstacle: person_blocking, pose: { frame: robot, x: 0.5, yaw: 3.14 } }
      - delay: { sec: 3.0 }
      - despawn: { obstacle: person_blocking }

monitors:
  - collision_monitor_action: { action: STOP, expect: occurs }
  - bt_node: { node: BackUp, status: RUNNING, expect: never }
