version: "2.0"
name: anomaly_gnss_building_west_weak
description: >
  調整に使わない変種 (anomaly_holdout)。anomaly_gnss_building_weak と場所・向き・大きさを変え、西の通路
  (x 約 -5 m の北向き) で GNSS を東 (棚の側) へ 3 m ずらし、同じ区間で人混み (人数と距離を変えたもの) を入れる。
  対策の調整に使わず、調整した結果がこの変種でも成り立つかを確かめる。構成は LOCALIZATION_CONFIG で選ぶ。
profile: mg01
world: warehouse
tags: [localization, anomaly_holdout, mg_sequencer, known_issue]
timeout: 600

record_topics: [/sim_scenario_test/entity_poses, /amcl_pose_origin, /odom/gps, /ekf_global_odom, /odom, /localization/status, /cmd_vel, /initialpose, /rosout]

sim_args:
  sensor_fault_file: "pkg://mg_scenario_test/scenarios/data/faults/anomaly_gnss_building_west_weak.yaml"

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

monitors:
  # 合否の上限は置かず、構成どうしの比較のために値を残す
  - pose_error: { deviation_m: 1.0 }
  - max_stop_duration: { max_stop_sec: 60.0, from_goal_started: 2, until_goal_reached: 8 }
  - map_overlap: { max_overlap_sec: 60.0 }
  - localization_hold: { ends_released: false }

run:
  mg_sequencer:
    waypoints_file: "{world.waypoints}"
    waypoint_timeout_sec: 200.0

timeline:
  - name: building_west_on
    when: { robot_near: { x: -4.6, y: -20.0, radius: 1.5, pose_source: sim } }
    do:
      - call_set_bool: { service: /fault_injector/trigger/building_west, value: true }
  - name: building_west_off
    when: { robot_near: { x: -5.3, y: -7.0, radius: 1.5, pose_source: sim } }
    required: false
    do:
      - call_set_bool: { service: /fault_injector/trigger/building_west, value: false }

expect:
  - reached_all
  - time_limit: { sec: 600 }
