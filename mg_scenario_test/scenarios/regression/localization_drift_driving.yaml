version: "2.0"
name: localization_drift_driving
description: >
  棚の列に沿った通路を走っている間に、自己位置推定を横へ少しずつずらす (推定器が誤った姿勢へ引きずられる
  状況の再現。真の位置は動かさない)。AMCL と EKF がそろってずれ、正しい GNSS だけが食い違う。
  ずれたまま長く走らず、自己位置の監督が戻してゴールへ着くことを確かめる。
  到達の判定はシミュレータ上の真の位置で行う。ずらす注入は /initialpose を使うので、監督はプロファイル
  fault_injection で /initialpose を外からの再初期化として扱わない。自己位置推定はプリセット robust。
  監督の起動の猶予と GNSS による初期化が済むよう、走行の前に待つ。
profile: mg01
world: warehouse
tags: [localization, drift, known_issue]
timeout: 300

stack_args:
  localization_monitor: supervisor
  localization_preset: robust
  localization_test_profile: fault_injection

setup:
  - respawn: { pose: { x: -4.0, y: 6.5, yaw: 0.0 }, settle_sec: 3.0 }
  - delay: { sec: 40.0 }

monitors:
  # ずらし終えた後、監督が戻すまでに走る距離の上限
  - pose_error: { deviation_m: 1.0, max_deviated_distance_m: 3.0 }
  - localization_hold: {}

run:
  nav2_goals:
    goal_timeout_sec: 200.0
    goals:
      - pose: { x: 11.0, y: 6.5, yaw: 0.0 }

timeline:
  - name: drift
    when: { robot_travelled: { distance: 1.5 } }
    do:
      - localization_drift: { rate: { y: 0.15 }, duration_sec: 12.0 }

expect:
  - reached_all
  - time_limit: { sec: 300 }
  - final_pose_error: { x: 11.0, y: 6.5, tolerance: 0.5, frame: world }
