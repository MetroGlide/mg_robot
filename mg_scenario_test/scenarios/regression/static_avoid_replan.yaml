version: "2.0"
name: static_avoid_replan
description: >
  走行中に進路の正面へ壁 (幅 5m) が出現しても、まず待ち (failure_tolerance)、居座るのでリカバリーの最初の段階
  (引き直し) で迂回路に乗り、首振りや後退をせずにゴールへ到達することを確認する。
profile: mg01
world: warehouse
tags: [smoke, static_obstacle, replan, nav2_goals]

obstacles:
  wall:
    model: { type: primitive, shape: box, size: { x: 0.3, y: 5.0, z: 1.5 }, static: true }

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }
  # 壁は待避位置に置き、出現時に teleport で正面へ出す
  - spawn: { obstacle: wall, pose: { frame: map, x: -30.0, y: -30.0, z: 0.75 } }

run:
  nav2_goals:
    behavior_tree: "pkg://mg_waypoint_navigation/behavior_trees/mg_navigate_to_pose.xml"
    goals:
      - pose: { x: 10.0, y: 6.0, yaw: 1.57 }

timeline:
  - name: wall_appears
    when: { robot_travelled: { distance: 3.0 } }
    do:
      # ロボットの進行方向に対して垂直な壁を、正面 2m に置く
      - teleport: { entity: wall, pose: { frame: robot, x: 2.0, y: 0.0, z: 0.75 } }

monitors:
  - min_scan_range: { min_range: 0.1, topic: /scan_top_lidar }
  # collision_monitor は RPP の後ろ盾なので、静止した障害物を避ける通常の走行では停止まで発動しない
  - collision_monitor_action: { action: STOP, expect: never }
  # 急に現れた居座る障害物は、まず failure_tolerance の間待つ (壁を出してから測り、迂回路へ向き直る
  # その場の回転は停止に数えない。failure_tolerance より少し短い下限)
  - max_stop_duration: { min_stop_sec: 4.0, after_timeline: wall_appears, include_turning: true }
  # 迂回路は引き直しで見つかるので、首振り・後退の段階に進まない
  - bt_node: { node: Spin, status: RUNNING, expect: never }
  - bt_node: { node: BackUp, status: RUNNING, expect: never }

expect:
  - reached_all
  - time_limit: { sec: 120 }
