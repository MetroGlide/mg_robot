version: "2.0"
name: localization_spread_aisle
description: >
  棚の列に沿った通路をシーケンサで走っている間に、自己位置推定の分布を通路に沿って 1 回だけ広げ、AMCL に峰を
  選び直させる (GNSS が棄却される区間で尤度が割れ、誤った峰が勝つ状況の再現。真の位置は動かさない)。通路は
  進む向きに似た形が続くので、誤った峰が勝つことがある。勝ったのが正しい峰なら止めずに走り、誤った峰なら
  ずれたまま長く走らず、監督が戻してゴールへ着くことを確かめる。
  到達の判定はシミュレータ上の真の位置で行う。注入は /initialpose を使うので、監督はプロファイル fault_injection
  (localization_test_profile) で /initialpose を外からの再初期化として扱わない。自己位置推定はプリセット robust。
  通路の前に開けた場所を走り、監督の準備ができて通路に入ってから注入する。
profile: mg01
world: warehouse
tags: [localization, drift, mg_sequencer, known_issue]
timeout: 300

stack_args:
  waypoints_load_path: "pkg://mg_scenario_test/scenarios/data/drift_aisle_waypoints.yaml"
  localization_monitor: supervisor
  localization_preset: robust
  localization_test_profile: fault_injection

setup:
  - respawn: { pose: { x: -4.0, y: 3.0, yaw: 3.1416 }, settle_sec: 3.0 }

monitors:
  - pose_error: { deviation_m: 1.0, max_deviated_distance_m: 3.0, max_deviated_sec: 20.0 }
  - localization_hold: {}

run:
  mg_sequencer:
    waypoints_file: "pkg://mg_scenario_test/scenarios/data/drift_aisle_waypoints.yaml"
    waypoint_timeout_sec: 200.0

timeline:
  - name: spread
    when:
      all_of:
        triggers:
          - localization_ready: { checks: [amcl_gnss] }
          - robot_near: { x: -3.0, y: 6.5, radius: 1.5 }
    do:
      - localization_spread: { offset: { x: 2.5 }, sigma: { x: 2.0, y: 0.3, yaw: 0.1 } }

expect:
  - reached_all
  - time_limit: { sec: 300 }
  - final_pose_error: { x: 11.0, y: 6.5, tolerance: 0.5, frame: world }
