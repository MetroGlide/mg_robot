version: "2.0"
name: anomaly_map_mismatch
description: >
  異常パターン 3 (測位用の地図と現場の形の食い違い)。測位用の地図だけ東側の棚の列と壁を西へずらし
  (localization_map_shift と同じ地図。計画用の地図と世界は元のまま)、基準の GNSS で 1 周する。
  対照は anomaly_baseline。構成は LOCALIZATION_CONFIG で選ぶ。
profile: mg01
world: warehouse
tags: [localization, anomaly, mg_sequencer, known_issue]
timeout: 600

sim_args:
  sensor_fault_file: "pkg://mg_scenario_test/scenarios/data/faults/anomaly_baseline.yaml"

stack_args:
  map_path: "pkg://mg_scenario_test/scenarios/data/map_shift_east/localization.yaml"

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

monitors:
  # 合否の上限は置かず、構成どうしの比較のために値を残す
  - pose_error: { deviation_m: 1.0 }
  - max_stop_duration: { max_stop_sec: 60.0, from_goal_started: 2, until_goal_reached: 8 }
  - map_overlap: { max_overlap_sec: 60.0 }
  - localization_hold: { ends_released: false }

run:
  mg_sequencer:
    waypoints_file: "{world.waypoints}"
    waypoint_timeout_sec: 200.0

expect:
  - reached_all
  - time_limit: { sec: 600 }
