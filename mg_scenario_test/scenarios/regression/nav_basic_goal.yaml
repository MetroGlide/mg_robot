version: "2.0"
name: nav_basic_goal
description: >
  障害物のない基本走行。単一ゴールに時間内に到達し、停止位置の誤差が許容内で、
  速度が上限を超えないことを確認する (ナビゲーション全体の最小の生存確認)。
profile: mg01
world: warehouse
tags: [smoke, basic, nav2_goals]

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

run:
  nav2_goals:
    goals:
      - pose: { x: 5.0, y: 2.0, yaw: 0.0 }

monitors:
  - max_speed: { limit: 1.0 }          # 巡航速度 (nav2_params.yaml のアンカー &v_max) より大きい上限
  # nav2_goals はシーケンサを通らないゴールなので、外部のゴールの走行として出る
  - navigation_activity: { code: external_goal }
  # collision_monitor は RPP の後ろ盾なので、障害物のない通常の走行では停止まで発動しない。
  # polygon を無効にしていても、scan の途絶による停止 (stop_on_timeout) は数えるので、判定は残す
  - collision_monitor_action: { action: STOP, expect: never }

expect:
  - reached_all
  - time_limit: { sec: 60 }
  - final_pose_error: { x: 5.0, y: 2.0, tolerance: 0.5 }
