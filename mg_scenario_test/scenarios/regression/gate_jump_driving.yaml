version: "2.0"
name: gate_jump_driving
description: >
  監督のノードの中の門 (localization_gate:=true) の戻し方を、走りへの影響で確かめる (小さい補正)。
  監督のプロファイル notify_only で、監督の判定は通知だけにし、門だけを働かせる。
  棚の列に沿った通路をシーケンサで走っている間に、AMCL を 1 回だけ横へ飛ばす (真の位置は動かさない)。
  門がすぐに閉じて EKF は飛んだ AMCL を取り込まないので、戻すときは EKF との差が小さい補正になる。
  戻し方は gate_drift_driving と同じく、監督の設定 (gate.settings) を差し替えて比べる。
  到達の判定はシミュレータ上の真の位置で行う。飛ばす注入は /initialpose (広がりの小さい分布) を使う。
profile: mg01
world: warehouse
tags: [localization, gate, kidnap, mg_sequencer]
timeout: 300

record_topics: [/sim_scenario_test/entity_poses, /amcl_pose_origin, /odom/gps, /ekf_global_odom, /odom, /localization/status, /cmd_vel, /initialpose, /rosout]

stack_args:
  waypoints_load_path: "pkg://mg_scenario_test/scenarios/data/drift_aisle_waypoints.yaml"
  localization_monitor: supervisor
  localization_gate: "true"
  localization_profile: notify_only
  localization_preset: none

setup:
  - respawn: { pose: { x: -4.0, y: 3.0, yaw: 3.1416 }, settle_sec: 3.0 }

monitors:
  - localization_outcome: { max_missed_distance_m: 3.0, max_false_hold_sec: 30.0 }
  - max_stop_duration: { max_stop_sec: 60.0, until_goal_reached: 2 }
  - pose_error: { deviation_m: 1.0 }
  - localization_hold: {}
  - map_overlap: { max_overlap_sec: 60.0 }

run:
  mg_sequencer:
    waypoints_file: "pkg://mg_scenario_test/scenarios/data/drift_aisle_waypoints.yaml"
    waypoint_timeout_sec: 200.0

timeline:
  - name: jump
    when:
      all_of:
        triggers:
          - localization_ready: { checks: [gate_amcl_gnss] }
          - robot_near: { x: -3.0, y: 6.5, radius: 1.5 }
    do:
      - localization_spread: { offset: { y: 1.5 }, sigma: { x: 0.05, y: 0.05, yaw: 0.02 } }

expect:
  - reached_all
  - time_limit: { sec: 300 }
  - final_pose_error: { x: 11.0, y: 6.5, tolerance: 0.5, frame: world }
