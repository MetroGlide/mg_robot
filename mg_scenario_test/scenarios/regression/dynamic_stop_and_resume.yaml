version: "2.0"
name: dynamic_stop_and_resume
description: >
  走行中に人が目の前 (1.4m) に飛び出しても、3 秒で立ち去れば、リカバリー (Spin / BackUp) に入らず
  停止して待つだけで走行を再開し、ゴールへ到達することを確認する。
  nav2_params.yaml の controller_server.failure_tolerance (待機時間) が有効に働いていることの回帰確認。
profile: mg01
world: warehouse
tags: [smoke, dynamic_obstacle, nav2_goals]

obstacles:
  person:
    model: { type: fuel, uri: "OpenRobotics/models/MaleVisitorOnPhone" }

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }
  # 人は走行範囲から離れた待避位置に置き、飛び出す時に teleport で出す
  # (Fuel モデルの spawn は約 1 秒かかり、その間にロボットが進んでしまうため)
  - spawn: { obstacle: person, pose: { frame: map, x: -30.0, y: -30.0, yaw: 3.14 } }

run:
  nav2_goals:
    behavior_tree: "pkg://mg_waypoint_navigation/behavior_trees/mg_navigate_to_pose.xml"
    goals:
      - pose: { x: 5.0, y: 2.0, yaw: 0.0 }

timeline:
  - name: person_jumps_out
    when: { robot_travelled: { distance: 1.0 } }
    do:
      - teleport: { entity: person, pose: { frame: robot, x: 1.4, yaw: 3.14 } }
      - delay: { sec: 3.0 }
      - teleport: { entity: person, pose: { frame: map, x: -30.0, y: -30.0, yaw: 3.14 } }

monitors:
  # 人に出会わないまま PASS しないこと (人は radius の円として扱う)
  - obstacle_clearance: { obstacles: [person], radius: 0.4, min_clearance: 0.0, require_within: 2.0 }
  # collision_monitor の STOP は判定に含めない: 障害物が近づくと controller (RPP) の衝突予測が先に
  # 速度を 0 にするため、STOP は発動しない
  - bt_node: { node: BackUp, status: RUNNING, expect: never }
  - bt_node: { node: Spin, status: RUNNING, expect: never }
  - navigation_activity: { code: recovery, expect: never }
  # 人が出ている間は、迂回せずに止まって待つ (出現時間より少し短い下限)
  - max_stop_duration: { min_stop_sec: 2.5, from_goal_started: 0, until_goal_reached: 0 }

expect:
  - reached_all
  - time_limit: { sec: 90 }
