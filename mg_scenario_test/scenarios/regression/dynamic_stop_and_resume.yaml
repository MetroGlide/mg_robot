version: "2.0"
name: collision_temporary_block
description: >
  至近距離に障害物が出現しても、movement_time_allowance (nav2_params.yaml の progress_checker、
  現在 5.0 秒) 以内に解消すれば、バックアップ等のリカバリーを行わずに、停止して待つだけで
  走行を再開できることを確認する。
profile: mg01
world: warehouse
tags: [collision, smoke]

# 判定: 全 waypoint への到達と、BackUp が発火しなかったこと (一時的な障害物ではリカバリーに入らず、
# 待つだけで再開したこと) を自動判定する。
# collision_monitor の STOP は判定に含めない。障害物が近づくと controller (RPP) の衝突予測が先に
# 速度を 0 にするため、collision_monitor が反応する (速度が障害物へ向かう) 場面がなく、STOP は発動しない。
# STOP の発動は、突然の飛び出しなど RPP の予測が間に合わない場合の保険で、
# collision_persistent_recovery で確認する。

obstacles:
  person_blocking:
    model: { type: fuel, uri: "OpenRobotics/models/MaleVisitorOnPhone" }

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

run:
  mg_sequencer:
    start_index: 0

timeline:
  # 走行開始 5 秒後、ロボット直前 (footprint 前端からおよそ 0.5m 以内) に障害物を出現させ、
  # movement_time_allowance より短い 3 秒で退避させる
  - name: temporary_block
    when: { goal_started: { index: 0 } }
    do:
      - delay: { sec: 5.0 }
      - spawn: { obstacle: person_blocking, pose: { frame: robot, x: 0.5, yaw: 3.14 } }
      - delay: { sec: 3.0 }
      - despawn: { obstacle: person_blocking }

monitors:
  - bt_node: { node: BackUp, status: RUNNING, expect: never }
