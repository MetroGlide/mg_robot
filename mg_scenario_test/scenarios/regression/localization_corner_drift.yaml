version: "2.0"
name: localization_corner_drift
description: >
  warehouse を 1 周する経路 (角が複数ある) をシーケンサで走り、後半の 3 つの角で、自己位置推定の向きを少しずつずらす
  (真の位置は動かさない)。角でずれても、ずれたまま走り続けず、止まったままにならず、人の操作なしで走りきることを確かめる。
  注入は /initialpose を使う状態遷移と復旧の回帰で、AMCL が自分で誤る過程の再現ではない。監督はプロファイル
  fault_injection、自己位置推定はプリセット robust。
profile: mg01
world: warehouse
tags: [localization, drift, corner, mg_sequencer, known_issue]
timeout: 500

stack_args:
  localization_monitor: supervisor
  localization_preset: robust
  localization_test_profile: fault_injection

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

monitors:
  # 暫定の基準: ずれたまま止める要求なしで走る距離、止まったままの時間、見かけの食い込み
  - localization_outcome: { max_missed_distance_m: 3.0, max_false_hold_sec: 30.0, require_deviation: true }
  - max_stop_duration: { max_stop_sec: 60.0, from_goal_started: 2, until_goal_reached: 8 }
  - map_overlap: { max_overlap_sec: 60.0 }
  # 以下は診断の記録 (合否に使わない)
  - pose_error: { deviation_m: 1.0 }
  - localization_hold: { ends_released: false }

run:
  mg_sequencer:
    waypoints_file: "{world.waypoints}"
    waypoint_timeout_sec: 200.0

timeline:
  - name: corner_south_east
    when: { robot_near: { x: 8.8, y: -23.9, radius: 2.5 } }
    do:
      - localization_drift: { rate: { yaw: 0.06 }, duration_sec: 8.0 }
  - name: corner_south_west
    when: { robot_near: { x: -4.4, y: -23.0, radius: 2.5 } }
    do:
      - localization_drift: { rate: { yaw: 0.06 }, duration_sec: 8.0 }
  - name: corner_north_west
    when: { robot_near: { x: -3.9, y: 0.0, radius: 2.5 } }
    do:
      - localization_drift: { rate: { yaw: 0.06 }, duration_sec: 8.0 }

expect:
  - reached_all
  - time_limit: { sec: 500 }
