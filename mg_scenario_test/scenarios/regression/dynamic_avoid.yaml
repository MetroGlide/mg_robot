version: "2.0"
name: pedestrian_crossing
description: >
  ロボットの進路を歩行者が横切る (移動する障害物)。ロボットが 1m 進んだ時点で歩行者が
  進路の脇から反対側へ歩き出す。歩行者に接触せず (LiDAR の最小測距が 0.15m 以上)、
  ゴールへ到達できることを確認する。歩行者の初期位置は seed で再現できる乱数で揺らす。
# 注意: 同一条件 (seed も同じ) で 3 回実行して 1 回、歩行者への急接近 (0.15m 未満) と
# 走行失敗が起きた。ロボット側の挙動のばらつきであり、smoke には含めていない。
profile: mg01
world: warehouse
tags: [dynamic, nav2_goals]
seed: 1

obstacles:
  pedestrian:
    model:
      type: primitive
      shape: cylinder
      size: { radius: 0.25, length: 1.7 }
      static: true

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

run:
  nav2_goals:
    goals:
      - pose: { x: 5.0, y: 2.0, yaw: 0.0 }

timeline:
  - name: pedestrian_crosses
    when: { robot_travelled: { distance: 1.0 } }
    do:
      - spawn:
          obstacle: pedestrian
          pose: { frame: map, x: 3.0, y: -1.5, z: 0.85 }
          jitter: 0.2
      - move_obstacle:
          obstacle: pedestrian
          to: { frame: map, x: 3.0, y: 3.5, z: 0.85 }
          speed: 0.8

monitors:
  # sim で実際にデータが出ているのは上部 LiDAR のみ (前方 LiDAR は何も配信しない)
  - min_scan_range: { min_range: 0.15, topic: /scan_top_lidar }

expect:
  - reached_all
  - time_limit: { sec: 120 }
