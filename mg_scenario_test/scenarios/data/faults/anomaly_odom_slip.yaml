# 異常パターン 11 (車輪の滑り)。基準の GNSS に、旋回中だけオドメトリの回転を大きく出す (corner_odom.yaml と同じ)。
faults:
  - {type: gnss_noise, start: 0.0, end: 100000.0, sigma: 0.3, tau: 30.0}
  - {type: gnss_accuracy, start: 0.0, end: 100000.0, std_m: 0.5}
  - {type: odom_scale, start: 0.0, end: 100000.0, v: 1.0, w: 1.2, min_abs_w: 0.15}
