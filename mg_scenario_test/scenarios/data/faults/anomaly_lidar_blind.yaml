# LiDAR の故障 (窓の汚れ・濃い霧などで、何も返らない)。基準の GNSS に、trigger blind の間だけスキャンを全て欠測にする。
# 自己位置の復旧でなく、センサの故障として扱う事象 (障害物も見えないので、走ってはいけない)。
faults:
  - {type: gnss_noise, start: 0.0, end: 100000.0, sigma: 0.3, tau: 30.0}
  - {type: gnss_accuracy, start: 0.0, end: 100000.0, std_m: 0.5}
  - {type: scan_range, trigger: blind, max_range: 0.0}
