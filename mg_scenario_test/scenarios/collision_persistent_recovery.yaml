version: "2.0"
name: collision_persistent_recovery
description: >
  至近距離の障害物が movement_time_allowance (現在 5.0 秒) を超えて居座った場合に
  FollowPath が失敗し、mg_navigate_to_pose.xml の RoundRobin リカバリー
  (Wait -> BackUp -> ClearCostmap 等) が発火したうえで、障害物除去後に目的地へ
  到達できることを確認する。
profile: mg01
world: warehouse
tags: [collision]

# 判定について: 現時点では「規定時間内に waypoint を通過できたか」のみを自動判定する。
# BackUp/ClearCostmap が発火したかは monitors (P4 で追加予定) で自動判定する。
# それまでは bt_navigator のログ等で目視確認すること。

obstacles:
  person_blocking:
    model: { type: fuel, uri: "OpenRobotics/models/MaleVisitorOnPhone" }

setup:
  - respawn: { pose: { x: 0.0, y: 0.0, yaw: 0.0 }, settle_sec: 3.0 }

run:
  mg_sequencer:
    start_index: 0

timeline:
  # 走行開始 5 秒後にロボット直前へ出現させ、20 秒居座らせてリカバリーを少なくとも 1 周発火させる
  - name: persistent_block
    when: { goal_started: { index: 0 } }
    do:
      - delay: { sec: 5.0 }
      - spawn: { obstacle: person_blocking, pose: { frame: robot, x: 0.5, yaw: 3.14 } }
      - delay: { sec: 20.0 }
      - despawn: { obstacle: person_blocking }
