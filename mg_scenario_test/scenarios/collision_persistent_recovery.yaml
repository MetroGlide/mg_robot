version: "1.0"
scenario_name: "collision_persistent_recovery"
world_name: "warehouse"

# 目的: 至近距離の障害物が movement_time_allowance (nav2_params.yaml の
# progress_checker, 現在5.0秒) を超えて居座った場合に、FollowPathアクションが
# 失敗し、mg_navigate_to_pose.xml の RoundRobin リカバリー
# (Wait -> BackUp -> ClearCostmap 等) が発火したうえで、障害物除去後に
# 最終的に目的地へ到達できることを確認する。
#
# 判定について: scenario_runner の成否判定は「waypointへ規定時間内(300秒)に
# 到達できたか」のみ。実際にBackUp/ClearCostmapが発火したか、
# behavior_server自身の衝突チェックが機能したかは自動判定しないため、
# 実行中は `ros2 topic echo /collision_monitor_state` や bt_navigator の
# ログ (Groot monitoring含む) で目視確認すること。

waypoints_nav_mode: "sequencer"
sequencer_namespace: "waypoint_sequencer_node"
start_waypoint_index: 0

obstacles:
  person_blocking:
    model: { type: "fuel", uri: "OpenRobotics/models/MaleVisitorOnPhone" }

goal_events:
  - waypoint_index: 0
    before:
      - type: reset_pose
        pose: { frame: "absolute", x: 0.0, y: 0.0, z: 0.05, yaw: 0.0 }
      - type: set_amcl_initial_pose
        pose: { frame: "absolute", x: 0.0, y: 0.0, z: 0.0, yaw: 0.0 }
      - type: delay
        sec: 3.0
      - type: set_sequencer_index
        target_index: 0
      - type: trigger_waypoint
        countdown_ms: 0
    during:
      - type: delay
        sec: 5.0
      # ロボット直前 (collision_monitor の PolygonStop/PolygonApproach 圏内) に
      # 障害物を出現させる
      - type: spawn_obstacle
        obstacle: "person_blocking"
        pose: { frame: "robot_relative", x: 0.5, y: 0.0, z: 0.0, yaw: 3.14 }
      # movement_time_allowance (5.0秒) を確実に超える時間居座らせ、
      # FollowPath失敗 -> RoundRobinリカバリー(Wait/BackUp/ClearCostmap)を
      # 少なくとも1周発火させる
      - type: delay
        sec: 20.0
      - type: despawn_obstacle
        obstacle: "person_blocking"
    after: []

finally:
  - type: cleanup_all_obstacles
