amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    scan_topic: /scan_top_lidar
    laser_max_range: -1.0
    laser_min_range: -1.0
    # ビームとパーティクルを減らして負荷と遅れを減らす (再生評価で、精度は同等以上で AMCL の遅延が約 26% 減った)。
    # 元の値は max_beams 1500 / max_particles 5000 / min_particles 1000
    max_beams: 240
    max_particles: 2000
    min_particles: 500

    # For filter update rates
    update_min_a: 0.2
    update_min_d: 0.25
    pf_err: 0.05
    pf_z: 0.99

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    sigma_hit: 0.2
    z_hit: 0.7
    z_rand: 0.3
    laser_likelihood_max_dist: 15.0
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5

    tf_broadcast: false # EKF being used; AMCL should not broadcast TF
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose: { x: 0.0, y: 0.0, z: 0.0, yaw: 0.0 }

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      # mg_navigation の BT プラグイン (mg_waypoint_navigation の BT で使う)
      - mg_is_path_clear_condition_bt_node
      - mg_is_path_blocked_condition_bt_node
      - mg_commit_path_action_bt_node

# behavior_server: BackUp/Spin/Wait/DriveOnHeading等のリカバリー動作を実行するノード。
# cmd_velはcollision_monitorを経由せず直接publishするため、後退・回転中の衝突回避は
# このノード自身のローカルコストマップベースの衝突チェック（simulate_ahead_time）が担う。
# 以前はNav2パッケージデフォルトに依存していたが、安全に関わるため明示的に設定する。
# 値はNav2標準デフォルトを踏襲しているが、Docker内での実際のデフォルト値確認および
# Gazebo/実機での検証を経て最終確定すること。
# NOTE: Humbleのnav2_behaviors::BehaviorServerが実際に読むのは costmap_topic/footprint_topic
# のみ（local_/global_の接頭辞や transform_timeout は存在せず無視される）。グローバル
# コストマップでの衝突チェックはこのバージョンでは行えないため、必要ならNav2アップグレード
# を検討すること。
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    # バックアップ/スピン実行中に衝突予測のためシミュレートする時間。値が短すぎると
    # 急な後方障害物の検知が間に合わない可能性があるため要検証。
    simulate_ahead_time: 2.0
    # Spin の旋回の速さ [rad/s] (全 Spin に共通)。リカバリーの首振りは障害物の近くで回るので、
    # ゆっくり回る値にする。min_rotational_vel 以上にする (test_nav2_params_consistency.py が検査する)
    max_rotational_vel: 0.5
    min_rotational_vel: 0.4
    # 旋回の加速度 [rad/s²]。RPP の max_angular_accel と velocity_smoother の旋回の max_accel / max_decel も同じ値にする。
    # アンカー (&名前 / *名前) はスカラー専用。リストや辞書に置くと Nav2 が起動しない (test_nav2_params_consistency.py が検査する)
    rotational_acc_lim: &w_acc 1.5

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # controller が有効な速度を出せない状態 (前方に障害物、進捗なし等) を許容する時間 [s]。
    # この間は速度 0 を出して待ち、超えると FollowPath が失敗して BT のリカバリー (Wait/BackUp) に入る。
    # 障害物の前で待つ時間はこの値で決まる。一時的な障害物なら消えるまで待つだけで再開できる長さにする
    # (0.5 だと出現から 1 秒足らずでリカバリーに入る)。progress_checker の movement_time_allowance は
    # これより長くする。
    # -1 (無期限) にはしないこと: progress_checker の「進捗なし」の失敗まで無視され、詰まっても
    # FollowPath が失敗せず、リカバリーにも入れず永久に停止する (Gazebo で確認)。
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    speed_limit_topic: "/speed_limit"

    # Progress checker parameters
    # movement_time_allowance: 「一定時間進まなければ詰まりとみなしFollowPathを失敗させる」タイムアウト。
    # 停止した地点から数え始め、障害物が去っても required_movement_radius 進むまでは止まらない。
    # failure_tolerance と同じだと、待っている途中で障害物が去っても、再開して進みきる前に失敗する。
    # そのため failure_tolerance に、再開して required_movement_radius 進む時間 (collision_monitor の
    # 減速を含む) を足した値より長くする。待つ時間は failure_tolerance だけで決まる。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # RPP parameters
    # 各パラメータの意味と調整の考え方は ../doc/rpp_tuning.md
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 巡航速度 [m/s]。velocity_smoother の max_velocity (x) も同じ値にする
      desired_linear_vel: &v_max 0.6
      # 先読み距離は「現在速度 × lookahead_time」を min〜max に収めた値 (use_velocity_scaled_lookahead_dist)。
      # 巡航速度 × lookahead_time が min と max の間に入るようにする。min に張り付くと速度連動が効かない
      # (test_nav2_params_consistency.py が検査する)。lookahead_dist は速度連動を使う間は参照されないので置かない
      lookahead_time: 1.6
      min_lookahead_dist: 0.8
      max_lookahead_dist: 1.8
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: *w_acc
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      # 経路上の carrot までの衝突の確認の時間。collision_monitor の PolygonApproach の time_before_collision より長くして、
      # RPP が先に減速・停止する (collision_monitor は通常の走行では発動しない後ろ盾)
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # コストによる減速は、ロボットの原点から障害物までの距離 (原点のセルのコストから逆算) が
      # cost_scaling_dist 未満のときに効く。距離はフットプリントの内接半径以上でしか求まらないので、
      # cost_scaling_dist は内接半径 (footprint_padding を含む) より大きくする。以下だと減速が一切効かない
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # コストから距離を逆算するための値。local_costmap の inflation_layer.cost_scaling_factor と同じ値にする
      # (アンカーで共有する。アンカーはスカラー専用)。違うと距離を誤って求め、コストによる減速がずれる
      inflation_cost_scaling_factor: &inflation_cost_scaling_factor 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05

      # footprint と footprint_padding は global_costmap と同じ値 (アンカーで共有する。スカラー専用)
      footprint: &robot_footprint "[[0.4, 0.25], [0.4, -0.25], [-0.2, -0.3], [-0.2, 0.3]]"
      footprint_padding: &footprint_padding 0.01

      plugins: [
          "top_obstacle_layer",
          # "depth_voxel_layer",
          "obstacle_stvl_layer",
          # "denoise_layer",
          "inflation_layer",
        ]

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨張の計算量は半径内のセル数に比例するので、半径を小さくすると負荷が減る。
        # 半径はフットプリントの外接半径 (padding 込みで約 0.64m) 以上にすること (Smac の衝突判定の高速化の条件)。
        # NavFn に戻す場合 (global_planner:=navfn) は、従来の inflation_radius: 2.5 / cost_scaling_factor: 1.0 も検討する。
        inflation_radius: 0.8
        # RPP の inflation_cost_scaling_factor と同じ値 (アンカーで共有)
        cost_scaling_factor: *inflation_cost_scaling_factor
      top_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # 近距離のノイズと自車の点を落とした scan (mg_drivers の laser_filters)
          topic: /scan_filtered/scan_top_lidar
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      depth_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 3.0
        mark_threshold: 0
        observation_sources: depth_camera
        depth_camera:
          topic: /camera/camera/depth/color/points
          max_obstacle_height: 1.5
          min_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
      obstacle_stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 5.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: True
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        mark_threshold: 0
        update_footprint_enabled: True
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: True
        transform_tolerance: 0.5
        mapping_mode: False
        map_save_duration: 60.0
        observation_sources: obstacle_points
        obstacle_points:
          data_type: PointCloud2
          topic: /obstacle_detection_3d_node/points_obstacle
          marking: True
          clearing: True
          obstacle_range: 2.5
          raytrace_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: False
          filter: "voxel"
          voxel_min_points: 1
          qos_overrides:
            reliability: reliable
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      map_topic: /planning_map
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False

      footprint: *robot_footprint
      footprint_padding: *footprint_padding

      resolution: 0.05
      track_unknown_space: true

      plugins: [
          "static_layer",
          "top_obstacle_layer",
          "obstacle_stvl_layer",
          # "denoise_layer",
          "inflation_layer",
        ]

      # filters: ["speed_filter"]

      top_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered/scan_top_lidar
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0

      depth_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 3.0
        mark_threshold: 0
        observation_sources: depth_camera
        depth_camera:
          topic: /rs_d435i/depth/color/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      obstacle_stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 25.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /obstacle_detection_3d_node/points_obstacle
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.0
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.047
          decay_acceleration: 1.0
          model_type: 0
          qos_overrides:
            reliability: reliable

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 10

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # local_costmap の inflation_layer と同じ理由 (負荷・外接半径) で小さくしている。
        # 従来値は 2.5 / 1.0 (NavFn に戻す場合 global_planner:=navfn は、この値も検討する)。
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        speed_limit_topic: "/speed_limit"

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

# planner_server: グローバルプランナ (プラグイン名は BT の planner_id に合わせて GridBased で固定)。
# GridBased の設定は launch 引数 global_planner (既定 smac_lattice) で選んだ次のファイルにある:
#   params/planner_smac_lattice.yaml : Smac Lattice (フットプリントで衝突判定。負荷を下げるパラメータのコメントあり)
#   params/planner_navfn.yaml        : NavFn (従来。計算負荷が小さい)
# 実機で負荷が高い場合は、global_planner:=navfn で NavFn に戻せる。
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 1
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/local_costmap/costmap"
    base: 100.0
    multiplier: -0.6

# collision_monitor: RPP (コストマップと経路に基づく衝突の確認) の後ろ盾になる、最後の安全層。
# 生の scan (前処理済み) だけで判定するので、コストマップの更新の遅れ (5 Hz) に依存しない。
# 障害物を主に避けるのは RPP とコストマップなので、通常の走行では発動しないように作る:
#   Approach の時間 (1.0 秒) は RPP の衝突の確認 (max_allowed_time_to_collision_up_to_carrot 1.5 秒) より短くする。
#   Stop は制動距離ぶんだけ (velocity_smoother の max_decel から決める)。
# polygon の形は、LiDAR の前処理 (mg_drivers の top_laser_filter.yaml) が自車の点を消す箱
# (x -0.25〜0.45, y ±0.35 = footprint + 5 cm) の外に置く。箱の中の点は消えているので、
# polygon が箱の中に入ると、そこでは何も検出できない。
# 値の関係は mg_navigation の test_nav2_params_consistency.py が検査する。
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav" # controller_server の出力
    cmd_vel_out_topic: "cmd_vel_collision" # velocity_smoother へ渡す
    state_topic: "collision_monitor_state" # TUI/診断での観測用
    transform_tolerance: 0.5
    # LiDAR は 10 Hz (rosbag の実測で最大の間隔 0.2 秒)。それを十分に超える時間だけ待つ
    source_timeout: 1.0
    base_shift_correction: True
    # 順序重要: STOPを先に評価させる（polygons.cpp のロジック上、STOPが決まった時点で
    # それ以降のpolygonはスキップされるため、より優先度の高いSTOPを先に置く）
    polygons: ["PolygonStop", "PolygonSlowdown", "PolygonApproach"]

    # 即時の緊急停止（速度ゼロ）。箱の前端 (x 0.45) から 0.25 m。
    # 制動距離 v²/(2·|max_decel|) = 0.8²/(2·2.0) = 0.16 m に、scan と制御の遅れ 0.1 秒ぶん (0.08 m) を足した値。
    # enabled は動的パラメータのため ros2 param set での即時切替も可能。
    PolygonStop:
      type: "polygon"
      points: [0.6, 0.35, 0.6, -0.35, 0.45, -0.35, 0.45, 0.35]
      action_type: "stop"
      min_points: 5
      enabled: False
      visualize: True
      polygon_pub_topic: "~/polygon_stop"

    # 側方から進路へ入ってくる対象 (横切る歩行者など) に早めに減速して、反応時間を稼ぐ。
    # ロボットの進路を横切る歩行者は、前方の箱 (Stop / Approach) に入る前に車体の側面・後部へ当たりうる
    # (Gazebo で、横切る歩行者が車体の右後方に接触した)。そのため両脇 0.8m、前方 1.4m、後方 0.3m と広く取る。
    # 狭い通路の壁で常に減速するようなら、y を狭める、slowdown_ratio を上げる、
    # enabled を false にする (ros2 param set で即時に切替可) で調整する。
    PolygonSlowdown:
      type: "polygon"
      points: [1.4, 0.8, 1.4, -0.8, -0.3, -0.8, -0.3, 0.8]
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      enabled: False
      visualize: True
      polygon_pub_topic: "~/polygon_slowdown"

    # 箱と同じ大きさの形 (footprint + 5 cm) を、現在の速度 (旋回を含む) で前方へシミュレートし、
    # time_before_collision 以内に接触するなら減速する。旋回中の側面の接触も対象になる。
    # footprint_topic (local_costmap/published_footprint) は使わない: padding 0.1 m を含んで幅 0.8 m になり、
    # 自車除去の箱より大きいので、箱の外の自車の点や、狭い隙間 (間隔 0.8 m のコーンなど) で止まってしまう。
    PolygonApproach:
      type: "polygon"
      points: [0.45, 0.35, 0.45, -0.35, -0.25, -0.35, -0.25, 0.35]
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: True
      enabled: False
      polygon_pub_topic: "~/polygon_approach"

    observation_sources: ["scan_top"]
    scan_top:
      type: "scan"
      # costmap と同じ前処理済みの scan (近距離のノイズと自車の点を落としたもの)
      topic: "scan_filtered/scan_top_lidar"
      enabled: True
      # True: このソースのデータが source_timeout 以上途絶えた (まだ届いていない場合を含む) とき、
      # ポリゴンの enabled によらず速度 0 にする (state の polygon_name は "source_timeout:scan_top")。
      # LiDAR や前処理が止まったまま走り続けるのを防ぐ。
      # 動的パラメータ: ros2 param set /collision_monitor scan_top.stop_on_timeout false
      stop_on_timeout: True

# https://docs.nav2.org/configuration/packages/configuring-velocity-smoother.html
# 速度指令の最後の段 (cmd_vel_collision -> cmd_vel)。最終的な速度の上限と加減速をここで決める。
# 上限は FollowPath の desired_linear_vel (アンカー &v_max) と同じ値にする。モータドライバ側にも
# 上限があるので (mg_drivers の motor_driver.max_speed)、そちらは v_max 以上にする。
# 加速は穏やかに、減速は大きめにする (collision_monitor の PolygonStop の奥行きは、この max_decel から決めている)。
# 旋回の加速度は、behavior_server の rotational_acc_lim と RPP の max_angular_accel (アンカー &w_acc) と同じ値にする。
# OPEN_LOOP なので、実機のモータが max_decel どおりに減速できるかは別に確認が要る。
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    # 加速度の制限で並進と旋回の比が崩れて曲率がずれるのを防ぐ
    scale_velocities: true
    # feedback: OPEN_LOOP時はOdomSmoother(odom_topic/odom_duration)は生成・参照されない。
    # 実測速度から滑らかに追従させたい場合はCLOSED_LOOPに変更しodom_topic/odom_durationを
    # 追加すること（挙動が変わるため今回は変更しない）。
    feedback: "OPEN_LOOP"
    max_velocity: [*v_max, 0.0, 1.2] # x, y, theta
    min_velocity: [-0.3, 0.0, -1.2]
    max_accel: [1.0, 0.0, *w_acc]
    max_decel: [-2.0, 0.0, -1.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
