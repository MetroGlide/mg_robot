# ナビゲーションのスタックで、自分で診断を出せないノードを外から調べる。
# LiDAR・odom・モータの途絶は driver_watchdog_node が、シーケンサの進捗は waypoint_sequencer_node が
# 自分の診断として出すので、ここでは調べない (doc/monitoring.md)。
topic_monitor_node:
  ros__parameters:
    # 受信頻度が 期待する周期 × hz_warn_ratio を下回ったら WARN
    hz_warn_ratio: 0.5
    # 起動直後は、初回のメッセージが無くても異常にしない
    startup_grace_sec: 30.0

    # ROS のグラフにいるかを調べるノード。名前空間を含めた形で書く
    monitored_nodes:
      - /waypoint_sequencer_node
      - /amcl
      - /bt_navigator
      - /controller_server
      - /planner_server
      - /collision_monitor

    # 受信頻度を調べるトピック。ここに ID を足し、下に同じ ID の設定を書く。
    # 設定のキーは mg_utils.monitoring.topic_source_config の docstring を参照
    monitored_sources: [amcl_pose, cmd_vel, collision_state]

    amcl_pose:
      topic: amcl_pose
      type: geometry_msgs/msg/PoseWithCovarianceStamped
      expected_hz: 1.0
      fault_level: warn
    cmd_vel:
      topic: cmd_vel
      type: geometry_msgs/msg/Twist
      expected_hz: 10.0
      qos: best_effort
      fault_level: warn
    collision_state:
      topic: collision_detector_state
      type: nav2_msgs/msg/CollisionDetectorState
      expected_hz: 5.0
      qos: best_effort
      fault_level: warn
