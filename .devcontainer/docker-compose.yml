services:
  # devcontainer.json の service と同じ名前にする
  develop:
    # develop は ../compose.yaml で ./:/app/ をマウント済み (workspaceFolder は /app)。
    # 追加のマウントは不要

    # C++ / Go / Rust などの ptrace ベースのデバッガを使う場合は、次の 4 行を有効にする。
    # cap_add:
    #   - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    # コマンドが終了してもコンテナが止まらないようにする
    command: /bin/sh -c "while sleep 1000; do :; done"
